name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Default features too: feature-gated fields and test helpers can be
      # dead here while the all-features run stays clean.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  check-feature-matrix:
    name: check (${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: default
            args: "--all-targets"
          - name: all-features
            args: "--all-targets --all-features"
          # no_std build: lib only; tests/benches use std-only dev-deps
          # (proptest, criterion, testcontainers, …) so `--all-targets`
          # under `--no-default-features` is intentionally not exercised.
          - name: no-default-features
            args: "--lib --no-default-features"
          # `sqlite-cdc` activated in isolation. Catches unconditional
          # uses of items that should be feature-gated under
          # `executor-diesel`, `pg-streaming`, or other neighbours; the
          # `all-features` row would mask such regressions because every
          # neighbour is also on.
          - name: sqlite-cdc
            args: "--all-targets --features sqlite-cdc"
          # Async execution features exercised in isolation, same rationale
          # as the sqlite-cdc row: catch items that should be gated behind
          # the async features but leak out unconditionally, which the
          # all-features row would mask. std-only (diesel-async needs a
          # runtime), so lib + all-targets is fine here.
          - name: executor-diesel-async-postgres
            args: "--all-targets --features executor-diesel-async-postgres"
          - name: executor-diesel-async-mysql
            args: "--all-targets --features executor-diesel-async-mysql"
          - name: apply-patchset-postgres-async
            args: "--all-targets --features apply-patchset-postgres-async"
          - name: apply-patchset-mysql-async
            args: "--all-targets --features apply-patchset-mysql-async"
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked ${{ matrix.profile.args }}

  wasm-check:
    name: check (${{ matrix.target }}, no_std)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          # Canonical browser/wasm-bindgen surface. A web-demo crate must
          # be able to pull subql in under `--no-default-features` without
          # further ceremony.
          - wasm32-unknown-unknown
          # WASI surface for server-side wasm runtimes (wasmtime, wasmer,
          # spin). Same `no_std + alloc` subset of subql; verifying both
          # triples on every push catches accidental target-specific
          # regressions before they reach a downstream consumer.
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The dispatch core (compiler, VM, WAL parsers, in-memory engine)
      # must compile cleanly under `--no-default-features` for every wasm
      # target subql advertises. Persistence + merge + config remain
      # `std`-only.
      - run: cargo check --lib --no-default-features --target ${{ matrix.target }} --locked

  # Compiling the workspace with every feature in release mode is the expensive
  # part of this pipeline by a wide margin: the same tests under default features
  # finish in a quarter of the time. So it happens once, here, and everything that
  # needs those binaries runs from the archive rather than building its own copy.
  # The cap is generous because a cold cache pays the whole compile.
  test-build:
    name: test build (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest archive --workspace --exclude subql-demo --all-features --release --locked --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest.tar.zst
          retention-days: 1

  # Default features get their own compile rather than riding the archive, because
  # the point of this leg is that the crate still builds and passes without any
  # optional feature switched on. It is also the cheap one.
  unit-tests-default:
    name: tests (default)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude subql-demo --lib --tests --release --locked

  unit-tests-all-features:
    name: tests (all-features)
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      # Ignored tests are exactly the Docker-backed ones, which the integration
      # jobs run, so leaving them skipped here is the same division as before.
      - run: cargo nextest run --archive-file nextest.tar.zst --workspace-remap . --no-fail-fast --test-threads 8

  # The Docker suite is split so its wall clock is the slowest group rather than
  # the sum, which had grown past an hour.
  integration:
    name: integration (${{ matrix.group.name }})
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The three filters partition the ignored set rather than enumerating it:
        # the last one is the complement of the other two, so a Docker-backed
        # test added tomorrow lands in a group by construction and cannot go
        # unrun. Filters match the test path (module plus function name), since
        # the merged `it` target replaced the per-file binaries these groups
        # used to select on.
        group:
          - name: mysql
            filter: test(~mysql)
            threads: 1
          - name: openfga
            filter: test(~openfga)
            threads: 8
          - name: postgres and the rest
            filter: not (test(~mysql) or test(~openfga))
            threads: 8
    steps:
      - uses: actions/checkout@v5
      # The tests read the fixture Dockerfile from the working tree and link
      # against these at run time, so the checkout and the libraries are needed
      # even though nothing is compiled here.
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      # MySQL runs one thread because concurrent container startups time out.
      # Other groups use eight.
      - run: cargo nextest run --archive-file nextest.tar.zst --workspace-remap . --run-ignored ignored-only --no-fail-fast --test-threads ${{ matrix.group.threads }} -E '${{ matrix.group.filter }}'

  docs:
    name: docs + doctests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --exclude subql-demo --no-deps --all-features --locked
      - run: cargo test --workspace --exclude subql-demo --doc --all-features --locked
      # The README / engine doctests use only the in-memory dispatch
      # surface (ParserDB, SubscriptionEngine, register, consumers,
      # aggregate_deltas) — load-bearing proof that the no_std subset is
      # end-to-end functional. The doctest harness itself still links
      # libstd; only subql's `std` feature is disabled.
      - run: cargo test --workspace --exclude subql-demo --doc --no-default-features --locked

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude subql-demo --lib --tests --release --locked

  bench-check:
    name: bench compile check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run --locked

  fuzz-check:
    name: fuzz target compile check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests-default, unit-tests-all-features]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --exclude subql-demo --all-features --profile coverage --locked --codecov --output-path codecov.json
      - uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-udeps --locked
      # `--all-features`, because the optional dependencies are exactly the ones
      # worth checking: every consumer of `rls2fga` sits behind `visibility-records`
      # or `visibility-openfga`, and the two test targets that use it declare
      # `required-features`. Under default features none of that compiles, so the
      # dependency and the dev-dependency both read as unused.
      - run: cargo +nightly udeps --all-targets --workspace --all-features

  audit:
    name: security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Pinned to commit SHA for supply-chain security (master HEAD as of 2026-03-20, Node 24)
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
