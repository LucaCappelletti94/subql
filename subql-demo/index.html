<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubQL demo</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 1rem auto; padding: 0 1rem; line-height: 1.45; }
      h1, h2 { margin: 0 0 .4rem 0; }
      section { border: 1px solid #ddd; border-radius: 6px; padding: .8rem 1rem; margin-bottom: 1rem; }
      table { width: 100%; border-collapse: collapse; font-size: .92rem; }
      th, td { text-align: left; padding: .25rem .4rem; border-bottom: 1px solid #eee; }
      button { padding: .35rem .7rem; margin-right: .35rem; }
      input, select, textarea { font: inherit; padding: .25rem .4rem; }
      .layout { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; }
      .log { font-family: ui-monospace, monospace; font-size: .82rem; max-height: 240px; overflow: auto; }
      .muted { color: #777; }
      .badges { display: flex; flex-wrap: wrap; gap: .35rem; margin: .35rem 0 .6rem 0; }
      .badge {
        display: inline-block;
        font-family: ui-monospace, monospace;
        font-size: .78rem;
        line-height: 1;
        padding: .35rem .55rem;
        border-radius: 999px;
        background: #eef2ff;
        color: #1e3a8a;
        border: 1px solid #c7d2fe;
        cursor: pointer;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge:hover { background: #dbeafe; }
      .schema-table th, .schema-table td { font-family: ui-monospace, monospace; font-size: .82rem; }
      .schema-table th { vertical-align: top; }
      .h-icon { vertical-align: -2px; margin-right: .35rem; color: #555; }
      .btn-icon { vertical-align: -1px; margin-right: .25rem; }
      h1 .h-icon { color: #b45309; }
    </style>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
