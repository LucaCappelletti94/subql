[package]
name = "subql-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
subql = { path = "..", features = ["testing", "pg-sqlite-emu"] }

# Standalone workspace - kept out of the parent on purpose. The root
# workspace has `lto = true` on its release profile, and cargo-fuzz
# layers ASAN + SanCov instrumentation on top, whose `__sancov_gen_*`
# runtime symbols do not survive LLVM LTO at link time. cargo-fuzz
# has no `--profile` flag and cargo silently rejects `lto` in
# per-package profile overrides, so the cleanest fix is to keep this
# crate in its own workspace with its own (no-LTO) release profile.
[workspace]
members = ["."]

# Mirror the root Cargo.toml [patch.crates-io] sqlparser pin. cargo-fuzz's
# standalone workspace does not inherit the parent workspace's patch
# table. Pinned to LucaCappelletti94/sqlparser-rs `pathological-combined`,
# which bundles every unmerged exponential-parse fix surfaced by this
# very fuzz harness. Keep this rev in lockstep with the root manifest;
# delete both blocks together once the bundled PRs land and a patched
# sqlparser release is on crates.io.
[patch.crates-io]
# Mirror root Cargo.toml [patch.crates-io] pins. cargo-fuzz's standalone
# workspace does not inherit the parent's patch table.
sqlparser = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "306abb569fcb64b84c79ab2284c71d69a4854307" }
sqlparser_derive = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "306abb569fcb64b84c79ab2284c71d69a4854307" }
# Route diesel through the LucaCappelletti94/future fork so the
# `SqliteConnection` here is the same type diesel-sqlite-session sees.
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
# Unify pg_walstream across subql and sqlite-diff-rs on this fork branch,
# so the `EventType` sqlite-diff-rs consumes is the type subql produces
# and `pg-sqlite-emu` encodes through the same pg_walstream 0.8.
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }

[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }

[profile.release]
debug = 1

[[bin]]
name = "fuzz_parse_sql"
path = "fuzz_targets/fuzz_parse_sql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_vm_eval"
path = "fuzz_targets/fuzz_vm_eval.rs"
test = false
doc = false
bench = false

