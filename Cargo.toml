[workspace]
members = ["subql-demo"]
# `fuzz/` is intentionally a separate workspace, not a member here.
# cargo-fuzz layers ASAN + SanCov on top of the workspace's release
# profile, and ASAN's runtime symbols don't survive LLVM LTO, so the
# fuzz binaries need `lto = false`. Cargo's per-package profile
# override doesn't actually accept `lto` (despite the docs listing it),
# and cargo-fuzz has no `--profile` flag, so the only working options
# are (a) drop LTO from the workspace `release` profile, hurting subql
# benches and the dioxus demo's wasm bundle size, or (b) keep fuzz as
# its own workspace with its own profile and mirror the root
# `[patch.crates-io]` block. We picked (b). See `fuzz/Cargo.toml`.
exclude = ["fuzz"]

[patch.crates-io]
# Diesel `future` branch: bundles the merged sqlite update-hook, the
# sqlite-expose-collected-binds accessor, and the mysql execute-returning-id
# work. Drop once these land in a diesel release.
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }
# sqlparser tracked from the apache/datafusion-sqlparser-rs main branch,
# the canonical upstream (version 0.62.0), which carries the merged
# visitor no_std fix (#2343) and compound-chain exponential fix (#2344).
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
# Unify pg_walstream across subql and sqlite-diff-rs on subql's fork
# branch (0.8.0 plus the `PgOutputDecoder`), so the `EventType` the
# crate's pg `Digestable` consumes is the same type subql's sources
# produce. This also lets `pg-sqlite-emu` encode through pg_walstream 0.8.
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder" }

# diesel-sqlite-session depends on diesel via git (not crates.io), so
# `[patch.crates-io]` above does not reach that graph. Route the git
# dep to the same LucaCappelletti94 fork used by the crates-io patch.
[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "future" }

[package]
name = "subql"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Luca"]
license = "MIT"
description = "SQL subscription dispatch engine for CDC event fanout"
repository = "https://github.com/luca/subql"
readme = "README.md"
keywords = ["sql", "cdc", "subscription", "postgres", "streaming"]
categories = ["database", "parser-implementations"]

[package.metadata.cargo-udeps.ignore]
# `arbitrary` is a dev-dependency used only by feature-gated integration
# tests (the pg-sqlite-emu proptests and the sqlite patchset e2e).
# `diesel-async` is likewise a dev-dependency used only by the async e2e
# tests, which are gated behind the async apply / executor features. udeps
# runs with default features and never compiles those targets, so it
# false-positives both as unused.
development = ["arbitrary", "diesel-async"]

[lib]
name = "subql"
path = "src/lib.rs"

# Memory profiling binary
[[bin]]
name = "memory_profile"
path = "src/bin/memory_profile.rs"
required-features = ["dhat-heap"]

# Benchmark harness
[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["dhat-heap"]

# Time the two cursed fuzz inputs that libFuzzer flagged as timeouts under
# the instrumented build, against an uninstrumented release. Sets the floor
# for how much headroom the libFuzzer `-timeout=N` knob actually needs.
[[bench]]
name = "sqlparser_cursed"
harness = false
required-features = ["testing"]

# Integration test for the DieselConnector. Uses in-memory SQLite. Gated
# behind the `executor-diesel` feature so default `cargo test` does not try
# to compile it.
[[test]]
name = "reexec_diesel"
required-features = ["executor-diesel"]

# Docker-free connector round-trip for the multi-column aggregate seed
# (`execute_scalar_row`) over in-memory SQLite. Gated behind
# `executor-diesel` like `reexec_diesel`.
[[test]]
name = "execute_scalar_row_sqlite"
required-features = ["executor-diesel"]

# Docker-backed integration test for AutoResolvingEngine + DieselConnector
# against a real Postgres with logical replication. Tests are #[ignore]d;
# run explicitly via:
#   cargo test --test reexec_postgres --features executor-diesel-postgres -- --ignored --nocapture
[[test]]
name = "reexec_postgres"
required-features = ["executor-diesel-postgres"]

[[test]]
name = "follow_insert_postgres"
required-features = ["diesel-typed"]

[[test]]
name = "follow_insert_sqlite"
required-features = ["diesel-typed-sqlite"]

# Smoke integration test for the fake-Postgres-over-SQLite CDC source.
# Gated behind `pg-sqlite-emu` so default `cargo test` skips it.
[[test]]
name = "pg_sqlite_emu_smoke"
required-features = ["pg-sqlite-emu"]

# INSERT / UPDATE / DELETE coverage for the emulator on single-PK and
# composite-PK tables. Composite PK is not exercised anywhere else.
[[test]]
name = "pg_sqlite_emu_dml"
required-features = ["pg-sqlite-emu"]

# End-to-end dispatch proptest for the emulator: arbitrary DML,
# reference oracle, engine notifications must match per event.
[[test]]
name = "proptest_pg_sqlite_emu_dispatch"
required-features = ["pg-sqlite-emu"]

# `follow_row` + emulator integration: PK-scoped follows observe
# INSERT / DELETE events routed through the pgoutput wire.
[[test]]
name = "follow_pg_sqlite_emu"
required-features = ["pg-sqlite-emu"]

# Structural CDC proptest: per-event shape assertions against a
# reference model. Distinct from proptest_pg_sqlite_emu_dispatch,
# which only checks oracle notifications.
[[test]]
name = "proptest_pg_sqlite_emu_cdc"
required-features = ["pg-sqlite-emu"]

# Docker-backed integration test for PgR2D2DieselConnector (pool-backed
# PG connector). Run with:
#   cargo test --test reexec_postgres_r2d2 \
#       --features executor-diesel-postgres-r2d2 -- --ignored --nocapture
[[test]]
name = "reexec_postgres_r2d2"
required-features = ["executor-diesel-postgres-r2d2"]

# Docker-backed integration test for MysqlDieselConnector against a real MySQL
# with binary logging. Tests are #[ignore]d; run via:
#   cargo test --test reexec_mysql --features executor-diesel-mysql -- --ignored --nocapture
[[test]]
name = "reexec_mysql"
required-features = ["executor-diesel-mysql"]

# Docker-backed E2E for apply_patchset_async against Postgres over a
# diesel-async connection. Run with:
#   cargo test --test apply_patchset_pg_async_e2e \
#       --features apply-patchset-postgres-async -- --ignored --nocapture
[[test]]
name = "apply_patchset_pg_async_e2e"
required-features = ["apply-patchset-postgres-async"]

# Docker-backed E2E for apply_diffset_bytes_async (patchset + changeset
# arms) and apply_changeset_async against Postgres over a diesel-async
# connection. Run with:
#   cargo test --test apply_diffset_async_pg_e2e \
#       --features apply-patchset-postgres-async -- --ignored --nocapture
[[test]]
name = "apply_diffset_async_pg_e2e"
required-features = ["apply-patchset-postgres-async"]

# Docker-backed E2E for apply_patchset_async against MySQL over a
# diesel-async connection. Run with:
#   cargo test --test apply_patchset_mysql_async_e2e \
#       --features apply-patchset-mysql-async -- --ignored --nocapture
[[test]]
name = "apply_patchset_mysql_async_e2e"
required-features = ["apply-patchset-mysql-async"]

# Docker-backed integration test for AsyncAutoResolvingEngine +
# PgAsyncDieselConnector against a real Postgres with logical replication.
# Run with:
#   cargo test --test reexec_postgres_async \
#       --features executor-diesel-async-postgres -- --ignored --nocapture
[[test]]
name = "reexec_postgres_async"
required-features = ["executor-diesel-async-postgres"]

# Docker-backed integration test for AsyncAutoResolvingEngine +
# MysqlAsyncDieselConnector against a real MySQL 8.0 with binary logging.
# Run with:
#   cargo test --test reexec_mysql_async \
#       --features executor-diesel-async-mysql -- --ignored --nocapture
[[test]]
name = "reexec_mysql_async"
required-features = ["executor-diesel-async-mysql"]

# Docker-backed integration test for PgStreamingCdcSource (push-based PG
# CDC source using START_REPLICATION via pg_walstream). Run with:
#   cargo test --test pg_streaming_e2e \
#       --features pg-streaming -- --ignored --nocapture
[[test]]
name = "pg_streaming_e2e"
required-features = ["pg-streaming"]

# Smoke test for the polling-based PG CDC source. Run with:
#   cargo test --test polling_smoke --features pg-streaming -- --ignored --nocapture
[[test]]
name = "polling_smoke"
required-features = ["pg-streaming"]

# Differential equivalence test: drives a deterministic DML stream
# against two slots concurrently, drains both push + poll, asserts
# they observed identical events. Catches pgoutput parser bugs and
# pg_walstream native-backend stream framing regressions. Run with:
#   cargo test --test cdc_equivalence --features pg-streaming -- --ignored --nocapture
[[test]]
name = "cdc_equivalence"
required-features = ["pg-streaming"]

# One-shot empirical benchmark comparing the two shipped library
# transports: the push-based `PgStreamingCdcSource` against the polling
# `PollingPgCdcSource`. Verifies the architectural claim that push
# delivers materially lower latency than polling at any poll cadence.
# Run once, paste numbers into `BENCHMARKS.md`.
[[test]]
name = "polling_vs_push_benchmark"
required-features = ["pg-streaming"]

# Docker-backed full CDC round-trip test on the wal2json vehicle:
# Postgres DML to wal2json CDC to emitted patchset, applied to a SQLite
# replica via `SqliteAdapter`, session patchset captured and re-applied
# to Postgres via `PgAdapter`, asserting row parity across the cycle.
# Run with:
#   cargo test --test round_trip_pg_wal2json_e2e \
#       --features "apply-patchset-postgres apply-patchset-sqlite sqlite-cdc" -- --ignored --nocapture
[[test]]
name = "round_trip_pg_wal2json_e2e"
required-features = [
    "apply-patchset-postgres",
    "apply-patchset-sqlite",
    "sqlite-cdc",
]

# Docker-backed full CDC round-trip test on the pgoutput vehicle: the
# same four-type loop as the wal2json test, but driven by real pgoutput
# binary changes decoded to `ChangeEvent` and emitted via
# `pgoutput_patchset_builder`. Run with:
#   cargo test --test round_trip_pg_pgoutput_e2e \
#       --features "pgoutput-emit apply-patchset-postgres apply-patchset-sqlite sqlite-cdc" -- --ignored --nocapture
[[test]]
name = "round_trip_pg_pgoutput_e2e"
required-features = [
    "pgoutput-emit",
    "apply-patchset-postgres",
    "apply-patchset-sqlite",
    "sqlite-cdc",
]

[dependencies]
# SQL parsing (supports multiple dialects).
sqlparser = { version = "0.62", default-features = false }

# Generic SQL schema traits + canonical SchemaFingerprint (FINGERPRINT_SPEC).
# `default-features = false` follows sql-traits' own gating. The `std`
# feature is propagated below.
sql-traits = { git = "https://github.com/earth-metabolome-initiative/sql-traits", branch = "main", default-features = false }

# Compressed bitmaps for predicate/user sets. Pinned below 0.11.4 because
# that release bumped its MSRV to 1.90. Subql's MSRV gate is 1.88.
roaring = ">=0.11, <0.11.4"

# Stable ID allocation (predicates)
slab = "0.4"

# Atomic pointer swap for immutable snapshots
arc-swap = "1.7"

# Fast hashing. `hashbrown` is no_std-friendly and ships its own default
# hasher (foldhash) via the `default-hasher` feature — no direct ahash dep
# required.
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher", "serde", "inline-more", "allocator-api2"] }
seahash = "4.1"        # Deterministic hashing for canonicalization

# Serialization. All no_std + alloc capable. Std features propagated below.
serde = { version = "1.0", default-features = false, features = ["derive", "rc", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

# Backend scalar type dependencies. `chrono` covers Timestamp / TimestampTz /
# Date / Time; `bigdecimal` covers arbitrary-precision NUMERIC / DECIMAL. Both
# are pinned no-default-features to keep subql's `no_std + alloc` posture.
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
bigdecimal = { version = "0.4", default-features = false, features = ["serde"] }
uuid = { version = "1", default-features = false, features = ["serde"] }

# Error handling
thiserror = { version = "2.0", default-features = false }

# I/O subsystem deps — only pulled in under the `std` feature. `lz4` wraps
# a C lib via `std::io`. `toml` depends on `std::fs`/`std::io`. Both are
# used exclusively by `src/persistence/*` and `src/config.rs`.
lz4 = { version = "1.24", optional = true }
toml = { version = "1", optional = true }

# Optional features
tracing = { version = "0.1", default-features = false, optional = true }
dhat = { version = "0.3", optional = true }
arbitrary = { version = "1", features = ["derive"], optional = true }

# PostgreSQL logical-replication decoder plus low-level parser.
# Temporarily pinned to the `feat/pgoutput-decoder` branch of the
# LucaCappelletti94 fork, which adds a connection-independent
# `PgOutputDecoder` (pgoutput bytes to `ChangeEvent`) so subql can drop
# its bespoke pgoutput parser. Repoint at a crates.io release once the
# decoder lands upstream. Default features (`std`, `rustls-tls`) are off
# so the base `--no-default-features` build stays `no_std + alloc` with
# no `tokio`. The `std` feature below propagates `pg_walstream/std`, and
# `pg-streaming` opts into `pg_walstream/rustls-tls` for the pure-Rust
# replication client.
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "feat/pgoutput-decoder", default-features = false }

# Optional diesel-backed Connector for the auto-resolving re-execution
# engine. Off by default - the lib's no_std + alloc / wasm32 surface stays
# clean unless `executor-diesel` is enabled. Diesel's default features
# (`with-deprecated` + its internal hashbrown wiring) are kept on. The
# downstream user activates whichever backend feature their diesel needs
# (`postgres`, `mysql`, `sqlite`) on their own dep. Here we stay
# backend-agnostic.
diesel = { version = "2", optional = true }

# Connection-pool dep used by `PgR2D2DieselConnector`. Activated by the
# `executor-diesel-postgres-r2d2` feature. Ignored otherwise.
r2d2 = { version = "0.8", optional = true }

# Async diesel execution driver. Backs both async paths: the async
# re-exec connectors (`src/reexec/async_diesel.rs`) and the async patchset
# apply methods (`src/patchset/mod.rs`). Off by default and
# `default-features = false` so its backend selection stays under subql's
# own feature gates. std-only (diesel-async needs an async runtime). Must
# resolve to the same diesel node as subql's `future` fork patch, which it
# does because diesel-async's `diesel ~2.3` requirement is satisfied by
# the fork.
diesel-async = { version = "0.7", optional = true, default-features = false }

# SQLite session-extension binary formats (changeset / patchset) plus the
# wal2json and Maxwell parsers subql implements `CdcEvent` on. Backs the
# `SqliteChangesetParser` and the Postgres/MySQL JSON CDC paths. `no_std +
# alloc` posture, no C deps (the `wal2json` and `maxwell` features pull only
# serde). `default-features = false` drops the `diesel` and `pg-walstream`
# reverse adapters, which the feature gates below opt into when needed.
sqlite-diff-rs = { version = "0.7.0", default-features = false, features = ["wal2json", "maxwell"] }

# Diesel wrapper around SQLite's session extension. Backs the Phase 8
# `SqliteCdcSource`: owns a live `SqliteConnection`, attaches tables
# to a session, and calls `.changeset()` to surface accumulated change
# bytes for `SqliteChangesetParser` to decode. Requires the diesel
# `future` branch already pinned via the top-level `[patch]` blocks.
diesel-sqlite-session = { git = "https://github.com/LucaCappelletti94/diesel-sqlite-session", optional = true }

# PG-DDL -> SQLite-DDL translator used by the `pg-sqlite-emu` feature
# (a fake Postgres CDC source layered on SQLite for doctests and fuzz).
# `default-features = false` drops the git2 + libssh2 + libz native
# deps so the emulator stays a pure-Rust addition.
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", branch = "main", default-features = false, optional = true }

# Future-combinator helpers (FuturesUnordered + StreamExt) used by the
# async auto-resolving engine to dispatch deduplicated triggers
# concurrently. `alloc` feature only. We do not depend on std-only
# combinators here.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Runtime-agnostic async primitives. Used by the async auto-resolving
# engine for its persistent re-execution concurrency cap (a `Semaphore`
# acquired by every connector call). Works under `no_std + alloc`, so
# we do not have to pull tokio just to get an async semaphore.
async-lock = { version = "3", default-features = false }

# Push-based PG CDC source (`pg-streaming` feature). `pg_walstream` is
# the unconditional parser dep above. The `rustls-tls` feature added by
# the `pg-streaming` cargo feature pulls the pure-Rust native backend.
# `tokio` is pulled with just the channels + runtime + macros + time
# bits the streaming source needs (no `rt-multi-thread`. The consumer
# chooses). `bytes` is the buffer type pg_walstream's stream surfaces;
# `tokio-util` is what its `CancellationToken` lives in.
tokio = { version = "1", optional = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", optional = true }
bytes = { version = "1", default-features = false }

[dev-dependencies]
# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Temporary directories for shard tests
tempfile = "3"

# Structured fuzzing (needed by regression tests)
arbitrary = { version = "1", features = ["derive"] }

# Cross-DB CDC integration test (`tests/cdc_cross_db.rs`) plus the
# DieselConnector integration test (`tests/reexec_diesel.rs`) which uses
# in-memory SQLite. `numeric`, `chrono`, and `serde_json` let the
# round-trip tests load a `NUMERIC` / `DECIMAL` column back as
# `bigdecimal::BigDecimal`, the temporal columns back as `chrono` types,
# and the `JSON` / `JSONB` columns back as `serde_json::Value` for the
# parity assertions, regardless of which apply feature a given test
# enables.
diesel = { version = "2", features = ["postgres", "mysql", "sqlite", "numeric", "chrono", "serde_json"] }
testcontainers = { version = "0.27", features = ["blocking"] }

# Async diesel execution for the async apply and async re-exec e2e tests
# (`apply_patchset_pg_async_e2e`, `reexec_postgres_async`, and the MySQL
# peers). The `bb8` feature provides the pool type the connectors wrap,
# reached through diesel-async's re-export. Both backends are enabled so a
# test can target whichever backend regardless of the single library
# feature it turns on.
diesel-async = { version = "0.7", default-features = false, features = ["postgres", "mysql", "bb8"] }

# Property-based testing
proptest = "1"

# Multi-task async runtime for tests that need real concurrency (e.g.
# `tests/reexec_throttle.rs`, which observes peak in-flight connector
# calls during a batch). Just enough features to spawn tasks and sleep.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

# Non-poisoning locks in test fixtures. Matches the workspace rs-parking-lot
# rule that bans `std::sync::Mutex/RwLock` where the guard is unwrapped.
parking_lot = "0.12"


[features]
default = ["std"]
# `std` enables the I/O subsystems: persistence (shard codec + background
# merge), `Config` file load/save, and the durable-shard trait surface on
# the engine. Disable (`default-features = false`) to build the in-memory
# dispatch core under `no_std + alloc` — required for the wasm32 target.
std = [
    "sqlparser/std",
    "sql-traits/std",
    "hashbrown/default",
    "serde/std",
    "serde_json/std",
    "postcard/use-std",
    "thiserror/std",
    "pg_walstream/std",
    "dep:lz4",
    "dep:toml",
]
testing = ["dep:arbitrary"]
observability = ["dep:tracing", "tracing/std"]
# Opt-in: ship `DieselConnector` plus the auto-resolving engine's diesel
# bindings. Implies `std` (diesel needs std). The user activates their
# backend on their own diesel dep.
executor-diesel = ["std", "dep:diesel"]
# Opt-in: the diesel-typed subscription/follow API. Renders a typed diesel
# query to placeholder SQL plus a list of bind `Value<B>`s and registers it
# via the string+binds core. This base feature covers the Postgres backend
# (byte-decoded from Pg's binary wire format via `postgres_backend`, pure Rust,
# no libpq, plus the opt-in-unstable collector fields to read the serialized
# binds). SQLite and MySQL extend it via `diesel-typed-sqlite` /
# `diesel-typed-mysql`.
diesel-typed = [
    "dep:diesel",
    "diesel?/postgres_backend",
    "diesel?/uuid",
    "diesel?/i-implement-a-third-party-backend-and-opt-into-breaking-changes",
]
# Opt-in: extend the diesel-typed follow API to SQLite. Adds `FollowRowDecode for
# Sqlite` plus SQLite RETURNING support. Unlike `diesel-typed` (pure-Rust
# `postgres_backend`), the SQLite backend pulls `libsqlite3-sys` (a C dependency),
# so it is a separate opt-in.
diesel-typed-sqlite = [
    "diesel-typed",
    "diesel?/sqlite",
    "diesel?/returning_clauses_for_sqlite_3_35",
]
# Opt-in: extend the diesel-typed subscription API to MySQL. Adds `BindDecode for
# Mysql`, which decodes MySQL's native-endian client bind buffers by `MysqlType`.
# Uses `mysql_backend` (pure Rust, no libmysqlclient), like `diesel-typed`'s
# `postgres_backend`. MySQL has no RETURNING, so this covers typed SELECT/UPDATE
# subscriptions only; the follow-insert path uses `execute_returning_id`.
diesel-typed-mysql = [
    "diesel-typed",
    "diesel?/mysql_backend",
]
# Opt-in: ship `PgDieselConnector`, an LSN-aware sync connector built on
# top of `executor-diesel` + diesel's `postgres` feature. Snapshots taken
# through this connector carry a `PgLsn` checkpoint read from
# `pg_current_wal_lsn()` inside the same transaction as the user query,
# so the snapshot value and the LSN agree on a single point in the WAL.
executor-diesel-postgres = ["executor-diesel", "diesel?/postgres"]
# Opt-in: ship `PgR2D2DieselConnector`, the pool-backed analogue of
# `PgDieselConnector`. Wraps `r2d2::Pool<ConnectionManager<PgConnection>>`,
# is `Send + Sync`, and reads `pg_current_wal_lsn()` inside the same
# transaction as the user query for LSN-anchored snapshots. Required when
# the auto-resolving engine dispatches connector calls concurrently or
# when snapshots may overlap CDC re-executions.
executor-diesel-postgres-r2d2 = [
    "executor-diesel-postgres",
    "dep:r2d2",
    "diesel?/r2d2",
]
# Opt-in: ship the `patchset::PgAdapter` and the
# `SubscriptionEngine::apply_patchset` entry point for executing a
# client-uploaded SQLite session patchset against a Postgres target via
# the diesel connection. Enables `sqlite-diff-rs`'s `diesel` feature,
# pulls in diesel's `postgres` backend, turns on diesel's `uuid` feature
# for native `UUID` binds, `numeric` for native `NUMERIC` / `DECIMAL`
# binds through `bigdecimal`, `chrono` for native temporal binds
# (`TIMESTAMP`, `TIMESTAMPTZ`, `DATE`, `TIME`), and `serde_json` for
# native `JSON` / `JSONB` binds. Dispatches `BOOLEAN`, `UUID`, `NUMERIC` /
# `DECIMAL`, the temporals, and `JSON` / `JSONB` today; other native PG
# types land as follow-up work.
apply-patchset-postgres = [
    "executor-diesel-postgres",
    "sqlite-diff-rs/diesel",
    "diesel?/uuid",
    "diesel?/numeric",
    "diesel?/chrono",
    "diesel?/serde_json",
]
# Opt-in: ship `MysqlDieselConnector`, a binlog-position-aware sync connector
# built on `executor-diesel` + diesel's `mysql` feature. Snapshots taken through
# it carry a `MysqlBinlogPos` read from `SHOW MASTER STATUS` inside the same
# transaction as the user query. Requires `libmysqlclient` at build time.
executor-diesel-mysql = ["executor-diesel", "diesel?/mysql"]
# Opt-in: ship the `patchset::MysqlAdapter` for executing a
# client-uploaded SQLite session patchset against a MySQL target via
# the diesel connection. Enables `sqlite-diff-rs`'s `diesel` feature
# and pulls in diesel's `mysql` backend. Bool (`TINYINT(1)`) is the
# MVP dispatch; other native MySQL types land as follow-up work.
apply-patchset-mysql = [
    "executor-diesel-mysql",
    "sqlite-diff-rs/diesel",
]
# Opt-in: async execution base. Ships the async re-exec connectors and the
# async patchset apply methods, both driven by `diesel-async`. Builds on
# the backend-agnostic `executor-diesel` base (which brings `std` plus the
# `DieselBackend` trait and the scalar row types the async connectors
# reuse) and adds `diesel-async`. The base pulls only diesel's
# backend-agnostic surface, no libpq or libmysqlclient. First-class peer of
# the sync `executor-diesel` ladder, additive: the sync surface is
# unchanged. The user activates a backend below.
executor-diesel-async = ["executor-diesel", "dep:diesel-async"]
# Opt-in: ship `PgAsyncDieselConnector`, the async LSN-aware analogue of
# `PgDieselConnector`. Wraps a `bb8` pool over `AsyncPgConnection`, is
# `Send + Sync`, and reads `pg_current_wal_lsn()` inside the same
# read-only repeatable-read transaction as the user query. `diesel-async/bb8`
# supplies the `ManageConnection` impl the pool needs.
executor-diesel-async-postgres = [
    "executor-diesel-async",
    "diesel-async/postgres",
    "diesel-async/bb8",
]
# Opt-in: ship `MysqlAsyncDieselConnector`, the async binlog-position-aware
# analogue of `MysqlDieselConnector`. Wraps a `bb8` pool over
# `AsyncMysqlConnection` and reads `performance_schema.log_status` in the
# same transaction as the user query.
executor-diesel-async-mysql = [
    "executor-diesel-async",
    "diesel-async/mysql",
    "diesel-async/bb8",
]
# Opt-in: async peer of `apply-patchset-postgres`. Adds the
# `apply_patchset_async` / `apply_changeset_async` / `apply_diffset_bytes_async`
# entry points against an async Postgres connection, driven by
# `sqlite-diff-rs`'s `diesel-async` execution surface. Reuses `PgAdapter`
# unchanged. std-only.
apply-patchset-postgres-async = [
    "apply-patchset-postgres",
    "dep:diesel-async",
    "diesel-async/postgres",
    "sqlite-diff-rs/diesel-async",
]
# Opt-in: async peer of `apply-patchset-mysql`. Adds the async apply entry
# points against an async MySQL connection. Reuses `MysqlAdapter`
# unchanged. std-only.
apply-patchset-mysql-async = [
    "apply-patchset-mysql",
    "dep:diesel-async",
    "diesel-async/mysql",
    "sqlite-diff-rs/diesel-async",
]
# Opt-in: ship the `patchset::SqliteAdapter` for executing a
# client-uploaded SQLite session patchset against another SQLite
# database via the diesel connection. The trivial case: source and
# target speak the same affinity-based type system, so every column
# falls through to `sqlite_diff_rs::DefaultBinder` and no per-type
# dispatch is needed. The adapter still exists so callers can resolve
# column names against a subql catalog.
apply-patchset-sqlite = [
    "dep:diesel",
    "diesel?/sqlite",
    "sqlite-diff-rs/diesel",
]
# Opt-in: ship the push-based PG CDC source. Activates `pg_walstream`'s
# `rustls-tls` native backend (pure-Rust, no libpq, no C deps beyond
# `cmake` for `aws-lc-rs`) and a `tokio` runtime surface for channels +
# spawn + timers. Implies `std` (tokio is decidedly not no_std). The
# trait `CdcSource` itself lives in subql core gated on `std` and is
# runtime-agnostic. This feature only adds the reference impl.
pg-streaming = [
    "std",
    "pg_walstream/rustls-tls",
    "dep:tokio",
    "dep:tokio-util",
]

# Opt-in: the live SqliteCdcSource that owns a diesel SqliteConnection
# with the session extension attached (via `diesel-sqlite-session`),
# generates changesets on demand, and feeds them to
# `SqliteChangesetParser` to emit typed `CdcEvent`s through the
# [`CdcSource`] trait. Base changeset parsing (`SqliteChangesetParser`)
# stays unconditional alongside the wal-format parsers; this feature
# only adds the live connection wrapper. Mirrors how `pg-streaming`
# gates `PgStreamingCdcSource` while `PgOutputParser` is unconditional.
sqlite-cdc = [
    "std",
    "dep:diesel",
    "diesel?/sqlite",
    "dep:diesel-sqlite-session",
]

# Opt-in: a fake Postgres CDC source layered on SQLite. Owns a diesel
# `SqliteConnection` with the session extension attached (via
# `diesel-sqlite-session`), translates the caller's PG DDL to SQLite
# DDL via `pg2sqlite`, applies it to the local database, and each poll
# drains a fresh session `changeset()`, re-encodes each row change as
# `pgoutput` wire bytes (via `sqlite-diff-rs`, which tracks `pg_walstream`
# 0.7), decodes them with the 0.8 `PgOutputDecoder`, and surfaces the
# resulting `ChangeEvent` values. They look identical to a real Postgres
# logical replication stream (`Backend = Postgres`), which lets doctests
# and fuzz harnesses
# exercise the pgoutput pipeline end-to-end without Docker. Distinct
# from `sqlite-cdc` (which is the honest `Backend = SQLite` source).
pg-sqlite-emu = [
    "std",
    "dep:diesel",
    "diesel?/sqlite",
    "dep:diesel-sqlite-session",
    "dep:pg2sqlite",
    "sqlite-diff-rs/pg-walstream",
]

# Opt-in: outbound patchset emission from pgoutput `ChangeEvent`s. Turns
# on sqlite-diff-rs's pg-walstream digest surface so subql's pg_walstream
# 0.8 events fold through `DiffSetBuilder::digest`. The wal2json and
# Maxwell emission paths need no feature (their digest surface is
# unconditional in `sqlite-diff-rs`), only the pg path does.
pgoutput-emit = ["sqlite-diff-rs/pg-walstream"]

# Memory profiling with dhat (std-only).
dhat-heap = ["std", "dep:dhat"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# Strip DWARF info. dx 0.7 defaults to embedding debug symbols in wasm
# (--debug-symbols=true), which makes binaryen abort during wasm-opt with
# "compile unit size was incorrect". Stripping in the linker keeps
# wasm-opt happy without losing release-grade optimisation, and shrinks
# subql's own release binaries too.
strip = "debuginfo"
debug = false

[profile.bench]
inherits = "release"


[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction lints (opt-in, high-value)
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
rest_pat_in_fully_bound_structs = "warn"
implicit_clone = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Allowed exceptions
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
