[workspace]
members = ["subql-demo"]
# `fuzz/` is intentionally a separate workspace, not a member here.
# cargo-fuzz layers ASAN + SanCov on top of the workspace's release
# profile, and ASAN's runtime symbols don't survive LLVM LTO, so the
# fuzz binaries need `lto = false`. Cargo's per-package profile
# override doesn't actually accept `lto` (despite the docs listing it),
# and cargo-fuzz has no `--profile` flag, so the only working options
# are (a) drop LTO from the workspace `release` profile, hurting subql
# benches and the dioxus demo's wasm bundle size, or (b) keep fuzz as
# its own workspace with its own profile and mirror the root
# `[patch.crates-io]` block. We picked (b); see `fuzz/Cargo.toml`.
exclude = ["fuzz"]

[patch.crates-io]
# Diesel sqlite hooks (PR #4969). Drop once the PR lands in a diesel release.
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "sqlite3_update_hook" }
# sqlparser pinned to the `pathological-combined` branch of the
# LucaCappelletti94 fork. This branch bundles every unmerged
# sqlparser-rs fix surfaced by subql's fuzz harness so far, on top of
# upstream main (which already carries the merged #2343 visitor no_std
# fix and the merged #2344 compound-chain exponential fix). Repoint at
# apache main once the bundled PRs land and a sqlparser release > 0.62.0
# ships.
sqlparser = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "306abb569fcb64b84c79ab2284c71d69a4854307" }
sqlparser_derive = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "306abb569fcb64b84c79ab2284c71d69a4854307" }

[package]
name = "subql"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Luca"]
license = "MIT OR Apache-2.0"
description = "SQL subscription dispatch engine for CDC event fanout"
repository = "https://github.com/luca/subql"
readme = "README.md"
keywords = ["sql", "cdc", "subscription", "postgres", "streaming"]
categories = ["database", "parser-implementations"]

[lib]
name = "subql"
path = "src/lib.rs"

# Memory profiling binary
[[bin]]
name = "memory_profile"
path = "src/bin/memory_profile.rs"
required-features = ["dhat-heap"]

# Benchmark harness
[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["dhat-heap"]

# Time the two cursed fuzz inputs that libFuzzer flagged as timeouts under
# the instrumented build, against an uninstrumented release. Sets the floor
# for how much headroom the libFuzzer `-timeout=N` knob actually needs.
[[bench]]
name = "sqlparser_cursed"
harness = false
required-features = ["testing"]

# Integration test for the DieselConnector; uses in-memory SQLite. Gated
# behind the `executor-diesel` feature so default `cargo test` does not try
# to compile it.
[[test]]
name = "reexec_diesel"
required-features = ["executor-diesel"]

# Docker-backed integration test for AutoResolvingEngine + DieselConnector
# against a real Postgres with logical replication. Tests are #[ignore]d;
# run explicitly via:
#   cargo test --test reexec_postgres --features executor-diesel -- --ignored --nocapture
[[test]]
name = "reexec_postgres"
required-features = ["executor-diesel"]

[dependencies]
# SQL parsing (supports multiple dialects).
sqlparser = { version = "0.62", default-features = false }

# Generic SQL schema traits + canonical SchemaFingerprint (FINGERPRINT_SPEC).
# `default-features = false` follows sql-traits' own gating; the `std`
# feature is propagated below.
sql-traits = { git = "https://github.com/earth-metabolome-initiative/sql-traits", branch = "main", default-features = false }

# Compressed bitmaps for predicate/user sets. Pinned below 0.11.4 because
# that release bumped its MSRV to 1.90; subql's MSRV gate is 1.88.
roaring = ">=0.11, <0.11.4"

# Stable ID allocation (predicates)
slab = "0.4"

# Atomic pointer swap for immutable snapshots
arc-swap = "1.7"

# `spin::Mutex` for the relation cache in the pgoutput parser. We pick spin
# because it's the standard no_std Mutex (works under WASM where OS threads
# are absent) and the relation cache is a low-contention surface where
# spin-wait overhead vs std Mutex is irrelevant.
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "once", "lazy"] }

# Fast hashing. `hashbrown` is no_std-friendly and ships its own default
# hasher (foldhash) via the `default-hasher` feature — no direct ahash dep
# required.
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher", "serde", "inline-more", "allocator-api2"] }
seahash = "4.1"        # Deterministic hashing for canonicalization

# Serialization — all no_std + alloc capable; std features propagated below.
serde = { version = "1.0", default-features = false, features = ["derive", "rc", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

# Error handling
thiserror = { version = "2.0", default-features = false }

# I/O subsystem deps — only pulled in under the `std` feature. `lz4` wraps
# a C lib via `std::io`; `toml` depends on `std::fs`/`std::io`. Both are
# used exclusively by `src/persistence/*` and `src/config.rs`.
lz4 = { version = "1.24", optional = true }
toml = { version = "1", optional = true }

# Optional features
tracing = { version = "0.1", default-features = false, optional = true }
dhat = { version = "0.3", optional = true }
arbitrary = { version = "1", features = ["derive"], optional = true }

# PostgreSQL logical-replication (`pgoutput`) parser. Backs the
# `PgOutputParser` adapter in `src/wal/pgoutput.rs`. Pinned to the
# `no-std` branch of the maintainer's fork while PR #74 is under review;
# upstream main already carries the `pgoutput-encoder` and optional-`tokio`
# features that `no-std` builds on top of. Default features are off so
# subql's `--no-default-features` build stays `no_std + alloc` with no
# `tokio` and no C deps; the `std` feature below propagates `std` through.
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "no-std", default-features = false }

# Optional diesel-backed Connector for the auto-resolving re-execution
# engine. Off by default - the lib's no_std + alloc / wasm32 surface stays
# clean unless `executor-diesel` is enabled. Diesel's default features
# (`with-deprecated` + its internal hashbrown wiring) are kept on; the
# downstream user activates whichever backend feature their diesel needs
# (`postgres`, `mysql`, `sqlite`) on their own dep; here we stay
# backend-agnostic.
diesel = { version = "2", optional = true }

[dev-dependencies]
# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Temporary directories for shard tests
tempfile = "3"

# Structured fuzzing (needed by regression tests)
arbitrary = { version = "1", features = ["derive"] }

# Cross-DB CDC integration test (`tests/cdc_cross_db.rs`) plus the
# DieselConnector integration test (`tests/reexec_diesel.rs`) which uses
# in-memory SQLite.
diesel = { version = "2", features = ["postgres", "mysql", "sqlite"] }
testcontainers = { version = "0.27", features = ["blocking"] }

# Property-based testing
proptest = "1"

[features]
default = ["std"]
# `std` enables the I/O subsystems: persistence (shard codec + background
# merge), `Config` file load/save, and the durable-shard trait surface on
# the engine. Disable (`default-features = false`) to build the in-memory
# dispatch core under `no_std + alloc` — required for the wasm32 target.
std = [
    "sqlparser/std",
    "sql-traits/std",
    "hashbrown/default",
    "serde/std",
    "serde_json/std",
    "postcard/use-std",
    "thiserror/std",
    "pg_walstream/std",
    "dep:lz4",
    "dep:toml",
]
testing = ["dep:arbitrary"]
observability = ["dep:tracing", "tracing/std"]
# Opt-in: ship `DieselConnector` plus the auto-resolving engine's diesel
# bindings. Implies `std` (diesel needs std). The user activates their
# backend on their own diesel dep.
executor-diesel = ["std", "dep:diesel"]

# Memory profiling with dhat (std-only).
dhat-heap = ["std", "dep:dhat"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# Strip DWARF info. dx 0.7 defaults to embedding debug symbols in wasm
# (--debug-symbols=true), which makes binaryen abort during wasm-opt with
# "compile unit size was incorrect". Stripping in the linker keeps
# wasm-opt happy without losing release-grade optimisation, and shrinks
# subql's own release binaries too.
strip = "debuginfo"
debug = false

[profile.bench]
inherits = "release"


[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction lints (opt-in, high-value)
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
rest_pat_in_fully_bound_structs = "warn"
implicit_clone = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Allowed exceptions
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
