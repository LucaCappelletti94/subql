[workspace]
members = ["subql-demo"]
# `fuzz/` is intentionally a separate workspace, not a member here.
# cargo-fuzz layers ASAN + SanCov on top of the workspace's release
# profile, and ASAN's runtime symbols don't survive LLVM LTO, so the
# fuzz binaries need `lto = false`. Cargo's per-package profile
# override doesn't actually accept `lto` (despite the docs listing it),
# and cargo-fuzz has no `--profile` flag, so the only working options
# are (a) drop LTO from the workspace `release` profile, hurting subql
# benches and the dioxus demo's wasm bundle size, or (b) keep fuzz as
# its own workspace with its own profile and mirror the root
# `[patch.crates-io]` block. We picked (b); see `fuzz/Cargo.toml`.
exclude = ["fuzz"]

[patch.crates-io]
# Diesel sqlite hooks (PR #4969). Drop once the PR lands in a diesel release.
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "sqlite3_update_hook" }
# sqlparser pinned to the `pathological-combined` branch of the
# LucaCappelletti94 fork. This branch bundles every unmerged
# sqlparser-rs fix surfaced by subql's fuzz harness so far, on top of
# upstream main (which already carries the merged #2343 visitor no_std
# fix and the merged #2344 compound-chain exponential fix). Repoint at
# apache main once the bundled PRs land and a sqlparser release > 0.62.0
# ships.
sqlparser = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "306abb569fcb64b84c79ab2284c71d69a4854307" }
sqlparser_derive = { git = "https://github.com/LucaCappelletti94/sqlparser-rs", rev = "306abb569fcb64b84c79ab2284c71d69a4854307" }

[package]
name = "subql"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Luca"]
license = "MIT OR Apache-2.0"
description = "SQL subscription dispatch engine for CDC event fanout"
repository = "https://github.com/luca/subql"
readme = "README.md"
keywords = ["sql", "cdc", "subscription", "postgres", "streaming"]
categories = ["database", "parser-implementations"]

[lib]
name = "subql"
path = "src/lib.rs"

# Memory profiling binary
[[bin]]
name = "memory_profile"
path = "src/bin/memory_profile.rs"
required-features = ["dhat-heap"]

# Benchmark harness
[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "memory"
harness = false
required-features = ["dhat-heap"]

# Time the two cursed fuzz inputs that libFuzzer flagged as timeouts under
# the instrumented build, against an uninstrumented release. Sets the floor
# for how much headroom the libFuzzer `-timeout=N` knob actually needs.
[[bench]]
name = "sqlparser_cursed"
harness = false
required-features = ["testing"]

# Integration test for the DieselConnector; uses in-memory SQLite. Gated
# behind the `executor-diesel` feature so default `cargo test` does not try
# to compile it.
[[test]]
name = "reexec_diesel"
required-features = ["executor-diesel"]

# Smoke test for the in-process SQLite-backed `CdcSource`. Gated behind
# the `sqlite-cdc` feature so default `cargo test` skips it.
[[test]]
name = "sqlite_cdc_smoke"
required-features = ["sqlite-cdc"]

# Full DML coverage (INSERT/UPDATE/DELETE on single-PK and composite-PK
# tables) for the in-process SQLite-backed `CdcSource`.
[[test]]
name = "sqlite_cdc_dml"
required-features = ["sqlite-cdc"]

# Property test: arbitrary DML sequences against a reference model for
# the in-process SQLite-backed `CdcSource`.
[[test]]
name = "proptest_sqlite_cdc"
required-features = ["sqlite-cdc"]

# End-to-end dispatch property test (Tier-2 + Tier-3): drives the source
# plus the real `SubscriptionEngine` and a fixed query set, verifies
# dispatched `ConsumerNotifications` against a Rust-side oracle. The
# Tier-3 path also encodes events through `PgOutputBridge` and decodes
# them back through `PgOutputParser`.
[[test]]
name = "proptest_sqlite_dispatch"
required-features = ["sqlite-cdc"]

# Tier-3 round-trip property test for `PgOutputBridge`: arbitrary
# `WalEvent` shapes encoded through the bridge must round trip back
# through `PgOutputParser` unchanged.
[[test]]
name = "proptest_pgoutput_bridge"
required-features = ["sqlite-cdc"]

# Docker-backed integration test for AutoResolvingEngine + DieselConnector
# against a real Postgres with logical replication. Tests are #[ignore]d;
# run explicitly via:
#   cargo test --test reexec_postgres --features executor-diesel-postgres -- --ignored --nocapture
[[test]]
name = "reexec_postgres"
required-features = ["executor-diesel-postgres"]

# Docker-backed integration test for PgR2D2DieselConnector (pool-backed
# PG connector). Run with:
#   cargo test --test reexec_postgres_r2d2 \
#       --features executor-diesel-postgres-r2d2 -- --ignored --nocapture
[[test]]
name = "reexec_postgres_r2d2"
required-features = ["executor-diesel-postgres-r2d2"]

# Docker-backed integration test for PgStreamingCdcSource (push-based PG
# CDC source using START_REPLICATION via pg_walstream). Run with:
#   cargo test --test pg_streaming_e2e \
#       --features pg-streaming -- --ignored --nocapture
[[test]]
name = "pg_streaming_e2e"
required-features = ["pg-streaming"]

# Smoke test for the polling-based PG CDC source. Run with:
#   cargo test --test polling_smoke --features pg-streaming -- --ignored --nocapture
[[test]]
name = "polling_smoke"
required-features = ["pg-streaming"]

# Differential equivalence test: drives a deterministic DML stream
# against two slots concurrently, drains both push + poll, asserts
# they observed identical events. Catches pgoutput parser bugs and
# pg_walstream native-backend stream framing regressions. Run with:
#   cargo test --test cdc_equivalence --features pg-streaming -- --ignored --nocapture
[[test]]
name = "cdc_equivalence"
required-features = ["pg-streaming"]

# One-shot empirical benchmark comparing the push-based source against a
# minimal polling implementation. The polling implementation is
# INTENTIONALLY NOT shipped in the library (see no-polling-cdc memory
# rule); this benchmark exists solely to verify the architectural claim
# that push delivers materially lower latency than polling. Run once,
# paste numbers into `docs/benchmarks/`, do not deploy.
[[test]]
name = "polling_vs_push_benchmark"
required-features = ["pg-streaming"]

# CDC workload benchmarks. Each example reproduces or extends the
# polling-vs-push comparison across a different workload regime; they
# are runnable programs (not assertions) whose stdout is meant to be
# captured into `docs/benchmarks/`. See
# `docs/cdc-workload-benchmark-plan.md` for the multi-phase plan. All
# share `examples/cdc_bench_common/mod.rs`; that file is included via
# `#[path = "cdc_bench_common/mod.rs"] mod common;` in each example.
# Phase 1 is fully implemented; phases 2-5 are scaffolds with `todo!()`
# workload bodies, awaiting follow-up implementation.

[[example]]
name = "phase1_baseline"
required-features = ["pg-streaming"]

[[example]]
name = "phase2_mixed_iud"
required-features = ["pg-streaming"]

[[example]]
name = "phase3_bursty"
required-features = ["pg-streaming"]

[[example]]
name = "phase4_adversarial"
required-features = ["pg-streaming"]

[[example]]
name = "phase5_schema_sweep"
required-features = ["pg-streaming"]

# Focused investigation example: the Phase 1 W1.3 push median (~30 ms
# after a 3 s idle vs ~5 ms wire RTT) does not match the wire-bound
# floor the architectural claim predicts. Sweeps idle duration and
# status-pump cadence to isolate the cause. Output goes to
# `docs/benchmarks/`.
[[example]]
name = "w1_3_idle_wakeup"
required-features = ["pg-streaming"]

# Focused investigation example: the Phase 1 W1.2 push median (13.9 ms
# at 500/s vs W3.3's 3.4 ms baseline at 100/s) suggests the source's
# bounded inner channel backpressures under high event rate. Sweeps
# event gap x `buffer_capacity` to confirm or refute.
[[example]]
name = "w1_2_burst_rate"
required-features = ["pg-streaming"]

# Smoothed Phase 1: per cell, runs multiple trials with a fresh
# source per trial and pools the samples. Produces tight, stable
# numbers usable as the headline polling-vs-push comparison.
[[example]]
name = "phase1_smoothed"
required-features = ["pg-streaming"]

# Scale benchmark suite: three examples that together quantify where
# push beats polling and by how much across realistic deployment
# scales. Outputs both Markdown stdout AND parallel .tsv files for
# external plotting. See docs/cdc-scale-report-2026-06-15.md for the
# synthesis report.
[[example]]
name = "scale_throughput"
required-features = ["pg-streaming"]

[[example]]
name = "scale_consumers"
required-features = ["pg-streaming"]

[[example]]
name = "scale_retention"
required-features = ["pg-streaming"]

# Decouples writer side from CDC side: Experiment W (writers only,
# no CDC consumers) vs Experiment C (single batched writer + N CDC
# consumers at fixed total rate). Tests whether the N=100 cliff
# observed in scale_consumers Experiment A is a write-side or CDC-
# side bottleneck.
[[example]]
name = "scale_isolation"
required-features = ["pg-streaming"]

# 2D mesh: (N consumers x producer rate) grid. Emits long-form rows
# usable as a heatmap, mapping the saturation surface as two
# independent axes.
[[example]]
name = "scale_mesh"
required-features = ["pg-streaming"]

# Sanity check that two fresh PG containers with identical schema
# produce CDC events that resolve to the same parser TableId via a
# shared Arc<ParserDB>. If this passes, the mesh substrate can share
# one catalog across M sources; if it fails, a per-source oid_remap
# is needed in MultiSourceFanIn.
[[example]]
name = "mesh_oid_sanity"
required-features = ["pg-streaming"]

# Mesh topology T1: M independent PG containers, no PG-to-PG
# replication, both subscription geometries (one-per-sub G1 and
# many-per-sub G2), uniform and skewed load shapes.
[[example]]
name = "mesh_independent"
required-features = ["pg-streaming"]

# Mesh topology T2: PG-native logical replication tree. One primary
# + (M-1) subscribers, all on a shared Docker network. Writers
# commit on the primary only; the per-node CdcSource latency
# difference quantifies the replication-delay tax.
[[example]]
name = "mesh_logical_rep"
required-features = ["pg-streaming"]

# Mesh topology T3: sharded workload across M independent PGs. G2
# geometry only (one subscription spans all shards via
# MultiSourceFanIn). Headline metric: per-shard drain fairness =
# per-source drain rate / per-source write rate.
[[example]]
name = "mesh_sharded"
required-features = ["pg-streaming"]

[dependencies]
# SQL parsing (supports multiple dialects).
sqlparser = { version = "0.62", default-features = false }

# Generic SQL schema traits + canonical SchemaFingerprint (FINGERPRINT_SPEC).
# `default-features = false` follows sql-traits' own gating; the `std`
# feature is propagated below.
sql-traits = { git = "https://github.com/earth-metabolome-initiative/sql-traits", branch = "main", default-features = false }

# Compressed bitmaps for predicate/user sets. Pinned below 0.11.4 because
# that release bumped its MSRV to 1.90; subql's MSRV gate is 1.88.
roaring = ">=0.11, <0.11.4"

# Stable ID allocation (predicates)
slab = "0.4"

# Atomic pointer swap for immutable snapshots
arc-swap = "1.7"

# `spin::Mutex` for the relation cache in the pgoutput parser. We pick spin
# because it's the standard no_std Mutex (works under WASM where OS threads
# are absent) and the relation cache is a low-contention surface where
# spin-wait overhead vs std Mutex is irrelevant.
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "once", "lazy"] }

# Fast hashing. `hashbrown` is no_std-friendly and ships its own default
# hasher (foldhash) via the `default-hasher` feature — no direct ahash dep
# required.
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher", "serde", "inline-more", "allocator-api2"] }
seahash = "4.1"        # Deterministic hashing for canonicalization

# Serialization — all no_std + alloc capable; std features propagated below.
serde = { version = "1.0", default-features = false, features = ["derive", "rc", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

# Error handling
thiserror = { version = "2.0", default-features = false }

# I/O subsystem deps — only pulled in under the `std` feature. `lz4` wraps
# a C lib via `std::io`; `toml` depends on `std::fs`/`std::io`. Both are
# used exclusively by `src/persistence/*` and `src/config.rs`.
lz4 = { version = "1.24", optional = true }
toml = { version = "1", optional = true }

# Optional features
tracing = { version = "0.1", default-features = false, optional = true }
dhat = { version = "0.3", optional = true }
arbitrary = { version = "1", features = ["derive"], optional = true }

# PostgreSQL logical-replication (`pgoutput`) parser. Backs the
# `PgOutputParser` adapter in `src/wal/pgoutput.rs`. Pinned to the
# `no-std` branch of the maintainer's fork while PR #74 is under review;
# upstream main already carries the `pgoutput-encoder` and optional-`tokio`
# features that `no-std` builds on top of. Default features are off so
# subql's `--no-default-features` build stays `no_std + alloc` with no
# `tokio` and no C deps; the `std` feature below propagates `std` through.
pg_walstream = { git = "https://github.com/LucaCappelletti94/pg-walstream", branch = "no-std", default-features = false }

# Optional diesel-backed Connector for the auto-resolving re-execution
# engine. Off by default - the lib's no_std + alloc / wasm32 surface stays
# clean unless `executor-diesel` is enabled. Diesel's default features
# (`with-deprecated` + its internal hashbrown wiring) are kept on; the
# downstream user activates whichever backend feature their diesel needs
# (`postgres`, `mysql`, `sqlite`) on their own dep; here we stay
# backend-agnostic.
diesel = { version = "2", optional = true }

# Connection-pool dep used by `PgR2D2DieselConnector`. Activated by the
# `executor-diesel-postgres-r2d2` feature; ignored otherwise.
r2d2 = { version = "0.8", optional = true }

# PG-DDL to SQLite-DDL translator used by the in-process `SqliteCdcSource`
# (`sqlite-cdc` feature). Gated on the feature so default builds do not
# pull it in. `default-features = false` drops git2 and the libssh2 +
# libz C deps it transitively pulls.
pg2sqlite = { git = "https://github.com/LucaCappelletti94/pg2sqlite", branch = "main", default-features = false, optional = true }

# Future-combinator helpers (FuturesUnordered + StreamExt) used by the
# async auto-resolving engine to dispatch deduplicated triggers
# concurrently. `alloc` feature only; we do not depend on std-only
# combinators here.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Runtime-agnostic async primitives. Used by the async auto-resolving
# engine for its persistent re-execution concurrency cap (a `Semaphore`
# acquired by every connector call). Works under `no_std + alloc`, so
# we do not have to pull tokio just to get an async semaphore.
async-lock = { version = "3", default-features = false }

# Push-based PG CDC source (`pg-streaming` feature). `pg_walstream` is
# the unconditional parser dep above; the `rustls-tls` feature added by
# the `pg-streaming` cargo feature pulls the pure-Rust native backend.
# `tokio` is pulled with just the channels + runtime + macros + time
# bits the streaming source needs (no `rt-multi-thread`; the consumer
# chooses). `bytes` is the buffer type pg_walstream's stream surfaces;
# `tokio-util` is what its `CancellationToken` lives in.
tokio = { version = "1", optional = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

# Temporary directories for shard tests
tempfile = "3"

# Structured fuzzing (needed by regression tests)
arbitrary = { version = "1", features = ["derive"] }

# Cross-DB CDC integration test (`tests/cdc_cross_db.rs`) plus the
# DieselConnector integration test (`tests/reexec_diesel.rs`) which uses
# in-memory SQLite.
diesel = { version = "2", features = ["postgres", "mysql", "sqlite"] }
testcontainers = { version = "0.27", features = ["blocking"] }

# Property-based testing
proptest = "1"

# Multi-task async runtime for tests that need real concurrency (e.g.
# `tests/reexec_throttle.rs`, which observes peak in-flight connector
# calls during a batch). Just enough features to spawn tasks and sleep.
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[features]
default = ["std"]
# `std` enables the I/O subsystems: persistence (shard codec + background
# merge), `Config` file load/save, and the durable-shard trait surface on
# the engine. Disable (`default-features = false`) to build the in-memory
# dispatch core under `no_std + alloc` — required for the wasm32 target.
std = [
    "sqlparser/std",
    "sql-traits/std",
    "hashbrown/default",
    "serde/std",
    "serde_json/std",
    "postcard/use-std",
    "thiserror/std",
    "pg_walstream/std",
    "dep:lz4",
    "dep:toml",
]
testing = ["dep:arbitrary"]
observability = ["dep:tracing", "tracing/std"]
# Opt-in: ship `DieselConnector` plus the auto-resolving engine's diesel
# bindings. Implies `std` (diesel needs std). The user activates their
# backend on their own diesel dep.
executor-diesel = ["std", "dep:diesel"]
# Opt-in: ship `PgDieselConnector`, an LSN-aware sync connector built on
# top of `executor-diesel` + diesel's `postgres` feature. Snapshots taken
# through this connector carry a `PgLsn` checkpoint read from
# `pg_current_wal_lsn()` inside the same transaction as the user query,
# so the snapshot value and the LSN agree on a single point in the WAL.
executor-diesel-postgres = ["executor-diesel", "diesel?/postgres"]
# Opt-in: ship `PgR2D2DieselConnector`, the pool-backed analogue of
# `PgDieselConnector`. Wraps `r2d2::Pool<ConnectionManager<PgConnection>>`,
# is `Send + Sync`, and reads `pg_current_wal_lsn()` inside the same
# transaction as the user query for LSN-anchored snapshots. Required when
# the auto-resolving engine dispatches connector calls concurrently or
# when snapshots may overlap CDC re-executions.
executor-diesel-postgres-r2d2 = [
    "executor-diesel-postgres",
    "dep:r2d2",
    "diesel?/r2d2",
]
# Opt-in: ship the push-based PG CDC source. Activates `pg_walstream`'s
# `rustls-tls` native backend (pure-Rust, no libpq, no C deps beyond
# `cmake` for `aws-lc-rs`) and a `tokio` runtime surface for channels +
# spawn + timers. Implies `std` (tokio is decidedly not no_std). The
# trait `CdcSource` itself lives in subql core gated on `std` and is
# runtime-agnostic; this feature only adds the reference impl.
pg-streaming = [
    "std",
    "pg_walstream/rustls-tls",
    "dep:tokio",
    "dep:tokio-util",
    "dep:bytes",
]

# Opt-in: ship the in-process SQLite-backed CDC source for Tier-2 + Tier-3
# testing. Installs triggers on a Diesel `SqliteConnection` and surfaces
# row mutations as `WalEvent`s through the same `CdcSource` trait the PG
# transports implement. The `PgOutputBridge` encodes `WalEvent`s as
# `pgoutput` bytes via `pg_walstream`'s encoder so the production
# `PgOutputParser` decodes them back inside `cargo test` (no Docker).
# Activates Diesel's `sqlite` backend and pulls in `pg2sqlite` for
# translating PG `CREATE TABLE` DDL onto SQLite. Test-only feature, off
# by default, never appears in production builds.
sqlite-cdc = [
    "std",
    "executor-diesel",
    "diesel?/sqlite",
    "dep:pg2sqlite",
    "dep:bytes",
]

# Memory profiling with dhat (std-only).
dhat-heap = ["std", "dep:dhat"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# Strip DWARF info. dx 0.7 defaults to embedding debug symbols in wasm
# (--debug-symbols=true), which makes binaryen abort during wasm-opt with
# "compile unit size was incorrect". Stripping in the linker keeps
# wasm-opt happy without losing release-grade optimisation, and shrinks
# subql's own release binaries too.
strip = "debuginfo"
debug = false

[profile.bench]
inherits = "release"


[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction lints (opt-in, high-value)
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
rest_pat_in_fully_bound_structs = "warn"
implicit_clone = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Allowed exceptions
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
