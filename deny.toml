[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # `sql_docs` is GPL-3.0. Pulled in as a build-only dev-tooling dependency
    # via sql-traits. Compatible with subql's MIT/Apache-2.0 dual licensing
    # since GPL-3.0 code is not statically linked into runtime artifacts.
    "GPL-3.0",
    # `tiny-keccak` (transitive via the FINGERPRINT_SPEC SHA3 path) is CC0.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

[advisories]
# RUSTSEC-2026-0253, `LruCache::pop` panic safety inside `mysql_async`'s
# statement cache, reached through `diesel-async` 0.9.2, is deliberately absent
# from this list: an ignore would hide a reachable unsoundness. The `security
# audit` job reports it as a warning without failing, and cargo-deny 0.19 does
# not raise informational advisories at all. Cleared by
# https://github.com/diesel-rs/diesel_async/pull/298, which bumps the minimum
# `mysql_async` to 0.37 and so allows the patched `lru` 0.18.2.
ignore = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = [
    # sqlparser pinned via [patch.crates-io] to LucaCappelletti94's fork at
    # the `pathological2` branch (PR apache/datafusion-sqlparser-rs#2349).
    # Repoint at upstream apache/datafusion-sqlparser-rs once #2349 merges.
    "https://github.com/LucaCappelletti94/sqlparser-rs",
    "https://github.com/apache/datafusion-sqlparser-rs",
    # diesel sqlite hooks (PR #4969). subql-demo uses hook-driven WAL emulation.
    "https://github.com/LucaCappelletti94/diesel",
    # pg2sqlite, the PG-DDL -> SQLite-DDL translator the demo uses for preset schemas.
    "https://github.com/LucaCappelletti94/pg2sqlite",
]
