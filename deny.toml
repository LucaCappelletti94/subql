[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # `sql_docs` is GPL-3.0; pulled in as a build-only dev-tooling dependency
    # via sql-traits. Compatible with subql's MIT/Apache-2.0 dual licensing
    # since GPL-3.0 code is not statically linked into runtime artifacts.
    "GPL-3.0",
    # `tiny-keccak` (transitive via the FINGERPRINT_SPEC SHA3 path) is CC0.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []

# Allow git dependency for sqlparser (upstream requires git version)
[[bans.skip]]
name = "sqlparser"
reason = "upstream requires git dependency"

[advisories]
ignore = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = ["https://github.com/apache/datafusion-sqlparser-rs"]
