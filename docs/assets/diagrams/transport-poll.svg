<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 500"
     width="900" height="500"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql polling transport</title>
  <desc>The CDC consumer periodically queries the slot for new
        changes. Dashed orange = polling query, solid orange =
        polling response. The slot auto-advances on each drain so no
        separate `ack` step is needed.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-writer   { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pg       { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pub      { fill: #c8e6c9; stroke: #2e7d32; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-poll     { fill: #fff3e0; stroke: #ef6c00; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-consumer { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; }

      .ink           { fill: #212121; font-size: 14px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-title     { fill: #212121; font-size: 20px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 12px; font-style: italic; }
      .ink-label     { fill: #424242; font-size: 11px; font-weight: 500; }
      .ink-poll      { fill: #bf360c; font-size: 11px; font-weight: 500; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2; }
      .poll-q        { stroke: #ef6c00; stroke-width: 2;
                       stroke-dasharray: 5 4; }
      .poll-r        { stroke: #ef6c00; stroke-width: 2.5; }
    ]]></style>
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
    <marker id="head-poll" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ink-title" x="450" y="40" text-anchor="middle">
    polling transport
  </text>
  <text class="ink-caption" x="450" y="62" text-anchor="middle">
    source queries the slot every P ms; one source still fans out to many subscribers in process
  </text>

  <!-- Writer (left) -->
  <rect class="role role-writer" x="50" y="220" width="110" height="60"
        rx="8" ry="8"/>
  <text class="ink" x="105" y="256" text-anchor="middle">writer</text>

  <!-- Postgres container (centre) -->
  <rect class="role role-pg" x="220" y="140" width="240" height="220"
        rx="10" ry="10"/>
  <text class="ink" x="232" y="166">Postgres</text>

  <!-- Publication chip -->
  <rect class="role role-pub" x="245" y="190" width="100" height="30"
        rx="5" ry="5"/>
  <text class="ink-small" x="295" y="210" text-anchor="middle">
    publication
  </text>

  <!-- Slot chip with notch -->
  <rect class="role role-slot" x="245" y="245" width="100" height="34"
        rx="5" ry="5"/>
  <path class="role role-slot" d="M245 260 L233 260 L233 274 L245 274 z"/>
  <text class="ink-small" x="295" y="268" text-anchor="middle">slot</text>

  <!-- CDC source with polling clock (right) -->
  <rect class="role role-cdc" x="540" y="200" width="160" height="100"
        rx="8" ry="8"/>
  <text class="ink-small" x="620" y="226" text-anchor="middle">
    CDC source
  </text>
  <text class="ink-small" x="620" y="242" text-anchor="middle">
    (one slot)
  </text>
  <!-- inline polling clock glyph -->
  <circle class="role role-poll" cx="620" cy="272" r="18"/>
  <line stroke="#bf360c" stroke-width="2" stroke-linecap="round"
        x1="620" y1="272" x2="620" y2="260"/>
  <line stroke="#bf360c" stroke-width="2" stroke-linecap="round"
        x1="620" y1="272" x2="629" y2="277"/>
  <circle fill="#bf360c" cx="620" cy="272" r="2"/>

  <!-- Three example subscribers downstream of the source -->
  <rect class="role role-consumer" x="750" y="140" width="130" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="815" y="162" text-anchor="middle">
    subscriber 1
  </text>
  <rect class="role role-consumer" x="750" y="232" width="130" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="815" y="254" text-anchor="middle">
    subscriber 2
  </text>
  <rect class="role role-consumer" x="750" y="324" width="130" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="815" y="346" text-anchor="middle">
    subscriber N
  </text>

  <!-- Fan-out arrows from CDC source to each subscriber -->
  <path class="arrow evt" d="M700 230 Q730 200 748 160"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="700" y1="250" x2="748" y2="250"
        marker-end="url(#head-evt)"/>
  <path class="arrow evt" d="M700 280 Q730 310 748 344"
        marker-end="url(#head-evt)"/>

  <!-- Writer commits to PG -->
  <line class="arrow evt" x1="160" y1="250" x2="218" y2="250"
        marker-end="url(#head-evt)"/>
  <text class="ink-label" x="189" y="240" text-anchor="middle">
    commits
  </text>

  <!-- Polling query (source → slot), dashed orange -->
  <path class="arrow poll-q" d="M540 230 Q470 200 360 240"
        marker-end="url(#head-poll)"/>
  <text class="ink-poll" x="450" y="200" text-anchor="middle">
    pg_logical_slot_get_binary_changes (every P ms)
  </text>

  <!-- Polling response (slot → source), solid orange -->
  <path class="arrow poll-r" d="M360 285 Q470 320 538 275"
        marker-end="url(#head-poll)"/>
  <text class="ink-poll" x="450" y="335" text-anchor="middle">
    events drained, slot advances
  </text>

  <!-- Footnote -->
  <text class="ink-caption" x="450" y="420" text-anchor="middle">
    short-lived queries; engine matches every event against every subscription's predicate
  </text>
  <text class="ink-caption" x="450" y="442" text-anchor="middle">
    slot auto-advances on drain, no separate `ack`
  </text>
</svg>
