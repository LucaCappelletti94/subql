<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 500"
     width="800" height="500"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql engine pipeline</title>
  <desc>Linear flow inside subql: CDC events arrive, get parsed,
        resolved against the catalog, matched against registered
        predicates, and dispatched as notifications to consumers.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-engine   { fill: #d1c4e9; stroke: #4527a0; stroke-width: 2; }
      .role-stage    { fill: #ede7f6; stroke: #5e35b1; stroke-width: 1.5; }
      .role-catalog  { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.5; }
      .role-consumer { fill: #e3f2fd; stroke: #1565c0; }

      .ink           { fill: #212121; font-size: 13px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-title     { fill: #212121; font-size: 20px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 12px; font-style: italic; }
      .ink-label     { fill: #424242; font-size: 11px; font-weight: 500; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2; }
      .ctrl          { stroke: #9e9e9e; stroke-width: 1.2;
                       stroke-dasharray: 3 3; }
    ]]></style>
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
    <marker id="head-ctrl" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ink-title" x="400" y="40" text-anchor="middle">
    engine pipeline
  </text>
  <text class="ink-caption" x="400" y="62" text-anchor="middle">
    inside subql: from a raw CDC event to consumer notifications
  </text>

  <!-- Input: CDC events from left -->
  <rect class="role role-slot" x="20" y="200" width="100" height="60"
        rx="6" ry="6"/>
  <text class="ink" x="70" y="226" text-anchor="middle">CDC</text>
  <text class="ink" x="70" y="246" text-anchor="middle">events</text>

  <!-- Stage 1: parse / decode -->
  <rect class="role role-stage" x="160" y="200" width="120" height="60"
        rx="6" ry="6"/>
  <text class="ink" x="220" y="226" text-anchor="middle">parse</text>
  <text class="ink-small" x="220" y="246" text-anchor="middle">
    pgoutput / wal2json
  </text>

  <!-- Catalog lookup (sits above the engine, both push and pull) -->
  <rect class="role role-catalog" x="280" y="100" width="180" height="60"
        rx="6" ry="6"/>
  <text class="ink" x="370" y="126" text-anchor="middle">catalog</text>
  <text class="ink-small" x="370" y="146" text-anchor="middle">
    table id, columns, primary key
  </text>

  <!-- Stage 2: predicate engine (main block) -->
  <rect class="role role-engine" x="320" y="200" width="200" height="100"
        rx="8" ry="8"/>
  <text class="ink" x="420" y="232" text-anchor="middle"
        style="font-weight:600">predicate engine</text>
  <text class="ink-small" x="420" y="256" text-anchor="middle">
    compiled bytecode VM
  </text>
  <text class="ink-small" x="420" y="278" text-anchor="middle">
    keeps per-table partition indexes
  </text>

  <!-- Stage 3: dispatch -->
  <rect class="role role-stage" x="560" y="200" width="120" height="60"
        rx="6" ry="6"/>
  <text class="ink" x="620" y="226" text-anchor="middle">dispatch</text>
  <text class="ink-small" x="620" y="246" text-anchor="middle">
    inserted, updated, deleted
  </text>

  <!-- Three consumer endpoints fanning out from dispatch -->
  <rect class="role role-consumer" x="700" y="120" width="80" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="740" y="142" text-anchor="middle">
    consumer 1
  </text>

  <rect class="role role-consumer" x="700" y="212" width="80" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="740" y="234" text-anchor="middle">
    consumer 2
  </text>

  <rect class="role role-consumer" x="700" y="304" width="80" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="740" y="326" text-anchor="middle">
    consumer 3
  </text>

  <!-- Main flow arrows -->
  <line class="arrow evt" x1="120" y1="230" x2="158" y2="230"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="280" y1="230" x2="318" y2="230"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="520" y1="230" x2="558" y2="230"
        marker-end="url(#head-evt)"/>

  <!-- Dispatch to consumers (fan out) -->
  <path class="arrow evt" d="M680 220 Q690 170 698 138"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="680" y1="230" x2="698" y2="230"
        marker-end="url(#head-evt)"/>
  <path class="arrow evt" d="M680 240 Q690 290 698 322"
        marker-end="url(#head-evt)"/>

  <!-- Catalog feeds parse and predicate engine -->
  <path class="arrow ctrl" d="M340 160 Q300 180 240 198"
        marker-end="url(#head-ctrl)"/>
  <path class="arrow ctrl" d="M400 160 Q400 180 400 198"
        marker-end="url(#head-ctrl)"/>

  <!-- Stage labels above arrows -->
  <text class="ink-label" x="139" y="220" text-anchor="middle">events</text>
  <text class="ink-label" x="299" y="220" text-anchor="middle">parsed</text>
  <text class="ink-label" x="539" y="220" text-anchor="middle">matches</text>

  <!-- Bottom caption -->
  <text class="ink-caption" x="400" y="410" text-anchor="middle">
    each consumer registers a predicate; the engine evaluates it per event and emits a notification on match
  </text>
</svg>
