<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 600"
     width="1000" height="600"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql mesh topology T3: sharded workload</title>
  <desc>M independent Postgres instances each holding a disjoint key
        range. subql uses the G2 geometry so one logical
        subscription spans all shards via a fan-in adapter.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-writer   { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pg       { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pub      { fill: #c8e6c9; stroke: #2e7d32; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-fanin    { fill: #b39ddb; stroke: #311b92; stroke-width: 2; }
      .role-engine   { fill: #d1c4e9; stroke: #4527a0; stroke-width: 2; }
      .role-consumer { fill: #e3f2fd; stroke: #1565c0; }
      .role-app      { fill: none; stroke: #1565c0; stroke-width: 1.5;
                       stroke-dasharray: 6 4; }

      .ink           { fill: #212121; font-size: 14px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-title     { fill: #212121; font-size: 20px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 12px; font-style: italic; }
      .ink-label     { fill: #424242; font-size: 11px; font-weight: 500; }
      .ink-shard     { fill: #5d4037; font-size: 12px; font-weight: 600;
                       font-family: 'JetBrains Mono', Menlo, monospace; }
      .ink-onfill    { fill: #ffffff; font-size: 13px; font-weight: 600; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2; }
    ]]></style>
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ink-title" x="500" y="40" text-anchor="middle">
    topology T3: sharded workload
  </text>
  <text class="ink-caption" x="500" y="62" text-anchor="middle">
    M Postgres instances hold disjoint key ranges; subql uses the G2 geometry to span them
  </text>

  <!-- Three sharded PG containers -->
  <g>
    <rect class="role role-pg" x="80" y="100" width="220" height="180"
          rx="8" ry="8"/>
    <text class="ink" x="190" y="128" text-anchor="middle">
      Postgres (shard 0)
    </text>
    <text class="ink-shard" x="190" y="150" text-anchor="middle">
      keys A..F
    </text>
    <rect class="role role-writer" x="100" y="170" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="138" y="189" text-anchor="middle">writer</text>
    <rect class="role role-pub" x="200" y="170" width="80" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="240" y="189" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="100" y="216" width="180" height="34"
          rx="4" ry="4"/>
    <text class="ink-small" x="190" y="237" text-anchor="middle">slot</text>
  </g>

  <g>
    <rect class="role role-pg" x="390" y="100" width="220" height="180"
          rx="8" ry="8"/>
    <text class="ink" x="500" y="128" text-anchor="middle">
      Postgres (shard 1)
    </text>
    <text class="ink-shard" x="500" y="150" text-anchor="middle">
      keys G..M
    </text>
    <rect class="role role-writer" x="410" y="170" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="448" y="189" text-anchor="middle">writer</text>
    <rect class="role role-pub" x="510" y="170" width="80" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="550" y="189" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="410" y="216" width="180" height="34"
          rx="4" ry="4"/>
    <text class="ink-small" x="500" y="237" text-anchor="middle">slot</text>
  </g>

  <g>
    <rect class="role role-pg" x="700" y="100" width="220" height="180"
          rx="8" ry="8"/>
    <text class="ink" x="810" y="128" text-anchor="middle">
      Postgres (shard 2)
    </text>
    <text class="ink-shard" x="810" y="150" text-anchor="middle">
      keys N..Z
    </text>
    <rect class="role role-writer" x="720" y="170" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="758" y="189" text-anchor="middle">writer</text>
    <rect class="role role-pub" x="820" y="170" width="80" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="860" y="189" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="720" y="216" width="180" height="34"
          rx="4" ry="4"/>
    <text class="ink-small" x="810" y="237" text-anchor="middle">slot</text>
  </g>

  <!-- CDC consumers -->
  <rect class="role role-cdc" x="110" y="310" width="160" height="40"
        rx="6" ry="6"/>
  <text class="ink-small" x="190" y="334" text-anchor="middle">
    CDC consumer
  </text>
  <line class="arrow evt" x1="190" y1="280" x2="190" y2="308"
        marker-end="url(#head-evt)"/>

  <rect class="role role-cdc" x="420" y="310" width="160" height="40"
        rx="6" ry="6"/>
  <text class="ink-small" x="500" y="334" text-anchor="middle">
    CDC consumer
  </text>
  <line class="arrow evt" x1="500" y1="280" x2="500" y2="308"
        marker-end="url(#head-evt)"/>

  <rect class="role role-cdc" x="730" y="310" width="160" height="40"
        rx="6" ry="6"/>
  <text class="ink-small" x="810" y="334" text-anchor="middle">
    CDC consumer
  </text>
  <line class="arrow evt" x1="810" y1="280" x2="810" y2="308"
        marker-end="url(#head-evt)"/>

  <!-- Fan-in funnel -->
  <path class="role role-fanin"
        d="M140 380 L860 380 L630 460 L370 460 z"/>
  <text class="ink-onfill" x="500" y="425" text-anchor="middle">
    fan in
  </text>

  <line class="arrow evt" x1="190" y1="350" x2="220" y2="378"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="500" y1="350" x2="500" y2="378"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="810" y1="350" x2="780" y2="378"
        marker-end="url(#head-evt)"/>

  <!-- Engine -->
  <rect class="role role-engine" x="380" y="490" width="240" height="56"
        rx="8" ry="8"/>
  <text class="ink" x="500" y="520" text-anchor="middle">engine</text>
  <text class="ink-small" x="500" y="538" text-anchor="middle">
    one predicate matches events from any shard
  </text>
  <line class="arrow evt" x1="500" y1="460" x2="500" y2="488"
        marker-end="url(#head-evt)"/>

  <!-- Side caption -->
  <text class="ink-label" x="500" y="572" text-anchor="middle">
    shard fairness = per-source drain / per-source write
  </text>
</svg>
