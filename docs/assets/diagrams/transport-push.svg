<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 500"
     width="900" height="500"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql push transport</title>
  <desc>Writer commits to Postgres; a long-lived wal sender streams
        events out via a persistent connection to the CDC consumer.
        A small control-flow back-arrow carries periodic status
        updates from the consumer to advance the slot.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-writer   { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pg       { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pub      { fill: #c8e6c9; stroke: #2e7d32; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-wal      { fill: #ef6c00; stroke: #bf360c; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-consumer { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; }

      .ink           { fill: #212121; font-size: 14px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-title     { fill: #212121; font-size: 20px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 12px; font-style: italic; }
      .ink-onfill    { fill: #ffffff; font-size: 12px; font-weight: 600; }
      .ink-label     { fill: #424242; font-size: 11px; font-weight: 500; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2.5; }
      .ctrl          { stroke: #9e9e9e; stroke-width: 1.2;
                       stroke-dasharray: 3 3; }
    ]]></style>
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
    <marker id="head-ctrl" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ink-title" x="450" y="40" text-anchor="middle">
    push transport
  </text>
  <text class="ink-caption" x="450" y="62" text-anchor="middle">
    long-lived wal sender streams events; one source fans out to many subscribers in process
  </text>

  <!-- Writer (left) -->
  <rect class="role role-writer" x="50" y="220" width="110" height="60"
        rx="8" ry="8"/>
  <text class="ink" x="105" y="256" text-anchor="middle">writer</text>

  <!-- Postgres container (centre) -->
  <rect class="role role-pg" x="220" y="140" width="280" height="220"
        rx="10" ry="10"/>
  <text class="ink" x="232" y="166">Postgres</text>

  <!-- Publication chip -->
  <rect class="role role-pub" x="240" y="190" width="100" height="30"
        rx="5" ry="5"/>
  <text class="ink-small" x="290" y="210" text-anchor="middle">
    publication
  </text>

  <!-- Slot chip with notch -->
  <rect class="role role-slot" x="240" y="245" width="100" height="34"
        rx="5" ry="5"/>
  <path class="role role-slot" d="M240 260 L228 260 L228 274 L240 274 z"/>
  <text class="ink-small" x="290" y="268" text-anchor="middle">slot</text>

  <!-- Wal sender (long-lived stream, drawn extending out of the PG) -->
  <rect class="role role-wal" x="380" y="190" width="40" height="140"
        rx="5" ry="5"/>
  <text class="ink-onfill" x="400" y="265" text-anchor="middle"
        transform="rotate(-90 400 265)">wal sender</text>

  <!-- Slot to wal sender internal connector -->
  <line class="arrow evt" x1="340" y1="262" x2="378" y2="262"
        marker-end="url(#head-evt)"/>

  <!-- CDC source + multi-subscriber fan-out (right) -->
  <rect class="role role-cdc" x="555" y="220" width="135" height="60"
        rx="8" ry="8"/>
  <text class="ink-small" x="622" y="246" text-anchor="middle">
    CDC source
  </text>
  <text class="ink-small" x="622" y="266" text-anchor="middle">
    (one slot)
  </text>

  <!-- Three example subscribers downstream of the source -->
  <rect class="role role-consumer" x="740" y="140" width="130" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="805" y="162" text-anchor="middle">
    subscriber 1
  </text>
  <rect class="role role-consumer" x="740" y="232" width="130" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="805" y="254" text-anchor="middle">
    subscriber 2
  </text>
  <rect class="role role-consumer" x="740" y="324" width="130" height="36"
        rx="5" ry="5"/>
  <text class="ink-small" x="805" y="346" text-anchor="middle">
    subscriber N
  </text>

  <!-- Fan-out arrows from CDC source to each subscriber -->
  <path class="arrow evt" d="M690 240 Q720 200 738 160"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="690" y1="250" x2="738" y2="250"
        marker-end="url(#head-evt)"/>
  <path class="arrow evt" d="M690 260 Q720 300 738 344"
        marker-end="url(#head-evt)"/>

  <!-- Writer commits to PG -->
  <line class="arrow evt" x1="160" y1="250" x2="218" y2="250"
        marker-end="url(#head-evt)"/>
  <text class="ink-label" x="189" y="240" text-anchor="middle">
    commits
  </text>

  <!-- Wal sender streams to CDC source (the focal arrow) -->
  <line class="arrow evt" x1="420" y1="230" x2="553" y2="230"
        marker-end="url(#head-evt)"/>
  <text class="ink-label" x="486" y="220" text-anchor="middle">
    events (streaming)
  </text>

  <!-- CDC source sends periodic status updates back -->
  <path class="arrow ctrl" d="M555 270 L420 280"
        marker-end="url(#head-ctrl)"/>
  <text class="ink-label" x="487" y="295" text-anchor="middle">
    status updates
  </text>

  <!-- Footnote -->
  <text class="ink-caption" x="450" y="420" text-anchor="middle">
    one long-lived connection per CDC source; engine matches every event against every subscription's predicate
  </text>
  <text class="ink-caption" x="450" y="442" text-anchor="middle">
    source must `ack` to advance the slot
  </text>
</svg>
