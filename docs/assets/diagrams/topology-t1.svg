<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 600"
     width="1000" height="600"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql mesh topology T1: independent peers</title>
  <desc>M independent Postgres instances with their own writers and
        their own data. No PG-to-PG replication. subql attaches to
        each instance independently.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-writer   { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pg       { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pub      { fill: #c8e6c9; stroke: #2e7d32; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-engine   { fill: #d1c4e9; stroke: #4527a0; stroke-width: 2; }
      .role-app      { fill: none; stroke: #1565c0; stroke-width: 1.5;
                       stroke-dasharray: 6 4; }

      .ink           { fill: #212121; font-size: 14px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-title     { fill: #212121; font-size: 20px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 12px; font-style: italic; }
      .ink-label     { fill: #424242; font-size: 11px; font-weight: 500; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2; }
    ]]></style>
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ink-title" x="500" y="40" text-anchor="middle">
    topology T1: independent peers
  </text>
  <text class="ink-caption" x="500" y="62" text-anchor="middle">
    M Postgres instances, no PG-to-PG replication, each owns its data
  </text>

  <!-- Subql container (top) -->
  <rect class="role role-app" x="80" y="100" width="880" height="170"
        rx="10" ry="10"/>
  <text class="ink" x="500" y="128" text-anchor="middle">subql</text>

  <!-- Three CDC consumer + engine stacks inside subql -->
  <g>
    <rect class="role role-cdc" x="120" y="148" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="200" y="172" text-anchor="middle">
      CDC consumer
    </text>
    <rect class="role role-engine" x="120" y="200" width="160" height="50"
          rx="6" ry="6"/>
    <text class="ink-small" x="200" y="223" text-anchor="middle">engine</text>
    <text class="ink-small" x="200" y="240" text-anchor="middle">
      predicate match
    </text>
  </g>

  <g>
    <rect class="role role-cdc" x="440" y="148" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="520" y="172" text-anchor="middle">
      CDC consumer
    </text>
    <rect class="role role-engine" x="440" y="200" width="160" height="50"
          rx="6" ry="6"/>
    <text class="ink-small" x="520" y="223" text-anchor="middle">engine</text>
    <text class="ink-small" x="520" y="240" text-anchor="middle">
      predicate match
    </text>
  </g>

  <g>
    <rect class="role role-cdc" x="760" y="148" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="840" y="172" text-anchor="middle">
      CDC consumer
    </text>
    <rect class="role role-engine" x="760" y="200" width="160" height="50"
          rx="6" ry="6"/>
    <text class="ink-small" x="840" y="223" text-anchor="middle">engine</text>
    <text class="ink-small" x="840" y="240" text-anchor="middle">
      predicate match
    </text>
  </g>

  <!-- Three PG containers, no arrows between them -->
  <g>
    <rect class="role role-pg" x="100" y="360" width="200" height="160"
          rx="8" ry="8"/>
    <text class="ink" x="200" y="388" text-anchor="middle">Postgres 0</text>
    <rect class="role role-writer" x="120" y="404" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="158" y="423" text-anchor="middle">writer</text>
    <rect class="role role-pub" x="208" y="404" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="246" y="423" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="120" y="450" width="164" height="34"
          rx="4" ry="4"/>
    <text class="ink-small" x="202" y="471" text-anchor="middle">slot</text>
    <text class="ink-small" x="200" y="504" text-anchor="middle"
          style="fill:#424242">tenant A data</text>

    <line class="arrow evt" x1="200" y1="358" x2="200" y2="278"
          marker-end="url(#head-evt)"/>
  </g>

  <g>
    <rect class="role role-pg" x="420" y="360" width="200" height="160"
          rx="8" ry="8"/>
    <text class="ink" x="520" y="388" text-anchor="middle">Postgres 1</text>
    <rect class="role role-writer" x="440" y="404" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="478" y="423" text-anchor="middle">writer</text>
    <rect class="role role-pub" x="528" y="404" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="566" y="423" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="440" y="450" width="164" height="34"
          rx="4" ry="4"/>
    <text class="ink-small" x="522" y="471" text-anchor="middle">slot</text>
    <text class="ink-small" x="520" y="504" text-anchor="middle"
          style="fill:#424242">tenant B data</text>

    <line class="arrow evt" x1="520" y1="358" x2="520" y2="278"
          marker-end="url(#head-evt)"/>
  </g>

  <g>
    <rect class="role role-pg" x="740" y="360" width="200" height="160"
          rx="8" ry="8"/>
    <text class="ink" x="840" y="388" text-anchor="middle">Postgres 2</text>
    <rect class="role role-writer" x="760" y="404" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="798" y="423" text-anchor="middle">writer</text>
    <rect class="role role-pub" x="848" y="404" width="76" height="30"
          rx="4" ry="4"/>
    <text class="ink-small" x="886" y="423" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="760" y="450" width="164" height="34"
          rx="4" ry="4"/>
    <text class="ink-small" x="842" y="471" text-anchor="middle">slot</text>
    <text class="ink-small" x="840" y="504" text-anchor="middle"
          style="fill:#424242">tenant C data</text>

    <line class="arrow evt" x1="840" y1="358" x2="840" y2="278"
          marker-end="url(#head-evt)"/>
  </g>

  <!-- No-replication annotation between PGs -->
  <text class="ink-label" x="360" y="540" text-anchor="middle">
    (no replication between Postgres instances)
  </text>
  <text class="ink-label" x="680" y="540" text-anchor="middle">
    (no replication between Postgres instances)
  </text>
</svg>
