<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 560"
     width="1000" height="560"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql in your stack: overview</title>
  <desc>Top-of-stack diagram: your application registers subscriptions
        with subql, subql consumes CDC events from one or more
        Postgres instances and dispatches matches back to the
        application.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-pg       { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pub      { fill: #c8e6c9; stroke: #2e7d32; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-engine   { fill: #d1c4e9; stroke: #4527a0; stroke-width: 2; }
      .role-subql    { fill: #f3e5f5; stroke: #4527a0; stroke-width: 2; }
      .role-app      { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; }
      .role-consumer { fill: #ffffff; stroke: #1565c0; }

      .ink           { fill: #212121; font-size: 14px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-large     { fill: #212121; font-size: 18px; font-weight: 600; }
      .ink-title     { fill: #212121; font-size: 22px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 13px; font-style: italic; }
      .ink-label     { fill: #424242; font-size: 11px; font-weight: 500; }
      .ink-callout   { fill: #5e35b1; font-size: 11px; font-weight: 500;
                       font-style: italic; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2.5; }
      .ctrl          { stroke: #9e9e9e; stroke-width: 1.4;
                       stroke-dasharray: 4 3; }
    ]]></style>
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
    <marker id="head-ctrl" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ink-title" x="500" y="44" text-anchor="middle">
    subql in your stack
  </text>
  <text class="ink-caption" x="500" y="68" text-anchor="middle">
    your application receives row-level CDC events from one or more Postgres instances, filtered by your predicates
  </text>

  <!-- Your application (left) -->
  <rect class="role role-app" x="50" y="140" width="220" height="280"
        rx="12" ry="12"/>
  <text class="ink-large" x="160" y="170" text-anchor="middle">
    your application
  </text>
  <rect class="role role-consumer" x="80" y="200" width="160" height="44"
        rx="6" ry="6"/>
  <text class="ink-small" x="160" y="227" text-anchor="middle">
    consumer A `tenant = 7`
  </text>
  <rect class="role role-consumer" x="80" y="258" width="160" height="44"
        rx="6" ry="6"/>
  <text class="ink-small" x="160" y="285" text-anchor="middle">
    consumer B `status = paid`
  </text>
  <rect class="role role-consumer" x="80" y="316" width="160" height="44"
        rx="6" ry="6"/>
  <text class="ink-small" x="160" y="343" text-anchor="middle">
    consumer C `total &gt; 10000`
  </text>
  <text class="ink-small" x="160" y="394" text-anchor="middle"
        style="fill:#424242">
    register predicates, receive matches
  </text>

  <!-- subql in the middle -->
  <rect class="role role-subql" x="370" y="140" width="260" height="280"
        rx="14" ry="14"/>
  <text class="ink-large" x="500" y="170" text-anchor="middle">subql</text>

  <!-- inside subql: CDC consumer + engine -->
  <rect class="role role-cdc" x="400" y="200" width="200" height="40"
        rx="6" ry="6"/>
  <text class="ink-small" x="500" y="225" text-anchor="middle">
    CDC consumer (push or polling)
  </text>

  <rect class="role role-engine" x="400" y="260" width="200" height="80"
        rx="6" ry="6"/>
  <text class="ink" x="500" y="290" text-anchor="middle"
        style="font-weight:600">engine</text>
  <text class="ink-small" x="500" y="310" text-anchor="middle">
    predicate match + dispatch
  </text>

  <text class="ink-small" x="500" y="396" text-anchor="middle"
        style="fill:#424242">
    one engine per Postgres (G1) OR fan in many (G2)
  </text>

  <!-- inline callouts in purple italic -->
  <text class="ink-callout" x="500" y="248" text-anchor="middle">
    see transport-push / transport-poll
  </text>
  <text class="ink-callout" x="500" y="356" text-anchor="middle">
    see geometry-g1 / geometry-g2
  </text>

  <!-- Postgres on the right (showing one + dim "1..M" sibling) -->
  <rect class="role role-pg" x="730" y="140" width="220" height="180"
        rx="10" ry="10"/>
  <text class="ink-large" x="840" y="170" text-anchor="middle">Postgres</text>
  <rect class="role role-pub" x="750" y="190" width="80" height="30"
        rx="4" ry="4"/>
  <text class="ink-small" x="790" y="209" text-anchor="middle">pub</text>
  <rect class="role role-slot" x="850" y="190" width="80" height="30"
        rx="4" ry="4"/>
  <text class="ink-small" x="890" y="209" text-anchor="middle">slot</text>
  <text class="ink-small" x="840" y="252" text-anchor="middle"
        style="fill:#424242">
    publication exposes rows; slot tracks consumer position
  </text>
  <text class="ink-small" x="840" y="280" text-anchor="middle"
        style="fill:#424242">
    writers commit normally; no app-side change
  </text>

  <!-- Faint "1..M" sibling PG underneath to suggest mesh -->
  <rect class="role role-pg" x="746" y="340" width="220" height="60"
        rx="10" ry="10"
        style="opacity:0.45"/>
  <text class="ink-small" x="856" y="376" text-anchor="middle"
        style="opacity:0.7">
    ... up to M Postgres instances
  </text>
  <text class="ink-callout" x="840" y="424" text-anchor="middle">
    see topology-t1 / topology-t2 / topology-t3
  </text>

  <!-- Arrows -->
  <!-- App registers predicates into subql -->
  <line class="arrow ctrl" x1="270" y1="280" x2="368" y2="280"
        marker-end="url(#head-ctrl)"/>
  <text class="ink-label" x="319" y="270" text-anchor="middle">
    register
  </text>

  <!-- subql notifies app of matches -->
  <path class="arrow evt" d="M368 320 L270 320"
        marker-end="url(#head-evt)"/>
  <text class="ink-label" x="319" y="335" text-anchor="middle">
    matches
  </text>

  <!-- subql pulls from Postgres -->
  <line class="arrow evt" x1="728" y1="240" x2="630" y2="240"
        marker-end="url(#head-evt)"/>
  <text class="ink-label" x="679" y="230" text-anchor="middle">
    events
  </text>

  <!-- Footer -->
  <text class="ink-caption" x="500" y="500" text-anchor="middle">
    the inner mechanics shown on the diagrams sitting under this one
  </text>
</svg>
