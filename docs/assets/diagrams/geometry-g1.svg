<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 600"
     width="1000" height="600"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql subscription geometry G1: one PG per subscription</title>
  <desc>Each PG has its own engine and CDC consumer stack. The
        application fans in matches from M independent engines.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-pg       { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pub      { fill: #c8e6c9; stroke: #2e7d32; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-engine   { fill: #d1c4e9; stroke: #4527a0; stroke-width: 2; }
      .role-app      { fill: none; stroke: #1565c0; stroke-width: 1.5;
                       stroke-dasharray: 6 4; }

      .ink           { fill: #212121; font-size: 14px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-title     { fill: #212121; font-size: 20px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 12px; font-style: italic; }
      .ink-label     { fill: #424242; font-size: 11px; font-weight: 500; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2; }
    ]]></style>
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ink-title" x="500" y="40" text-anchor="middle">
    geometry G1: one Postgres per subscription
  </text>
  <text class="ink-caption" x="500" y="62" text-anchor="middle">
    M engines, app-layer fan-in
  </text>

  <!-- Three Postgres columns -->
  <!-- Column geometry: x in {100, 420, 740}, each col is 200 wide -->
  <g>
    <!-- PG 0 -->
    <rect class="role role-pg" x="100" y="100" width="200" height="100"
          rx="8" ry="8"/>
    <text class="ink" x="200" y="130" text-anchor="middle">Postgres 0</text>
    <rect class="role role-pub" x="120" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="158" y="163" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="208" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="246" y="163" text-anchor="middle">slot</text>

    <!-- CDC consumer 0 -->
    <rect class="role role-cdc" x="120" y="240" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="200" y="264" text-anchor="middle">
      CDC consumer
    </text>

    <!-- Engine 0 -->
    <rect class="role role-engine" x="120" y="310" width="160" height="60"
          rx="6" ry="6"/>
    <text class="ink" x="200" y="338" text-anchor="middle">engine</text>
    <text class="ink-small" x="200" y="356" text-anchor="middle">
      predicate match
    </text>

    <!-- PG 0 -> CDC 0 -->
    <line class="arrow evt" x1="200" y1="200" x2="200" y2="238"
          marker-end="url(#head-evt)"/>
    <!-- CDC 0 -> Engine 0 -->
    <line class="arrow evt" x1="200" y1="280" x2="200" y2="308"
          marker-end="url(#head-evt)"/>
    <!-- Engine 0 -> App -->
    <line class="arrow evt" x1="200" y1="370" x2="200" y2="448"
          marker-end="url(#head-evt)"/>
  </g>

  <g>
    <!-- PG 1 -->
    <rect class="role role-pg" x="420" y="100" width="200" height="100"
          rx="8" ry="8"/>
    <text class="ink" x="520" y="130" text-anchor="middle">Postgres 1</text>
    <rect class="role role-pub" x="440" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="478" y="163" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="528" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="566" y="163" text-anchor="middle">slot</text>

    <rect class="role role-cdc" x="440" y="240" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="520" y="264" text-anchor="middle">
      CDC consumer
    </text>

    <rect class="role role-engine" x="440" y="310" width="160" height="60"
          rx="6" ry="6"/>
    <text class="ink" x="520" y="338" text-anchor="middle">engine</text>
    <text class="ink-small" x="520" y="356" text-anchor="middle">
      predicate match
    </text>

    <line class="arrow evt" x1="520" y1="200" x2="520" y2="238"
          marker-end="url(#head-evt)"/>
    <line class="arrow evt" x1="520" y1="280" x2="520" y2="308"
          marker-end="url(#head-evt)"/>
    <line class="arrow evt" x1="520" y1="370" x2="520" y2="448"
          marker-end="url(#head-evt)"/>
  </g>

  <g>
    <!-- PG 2 -->
    <rect class="role role-pg" x="740" y="100" width="200" height="100"
          rx="8" ry="8"/>
    <text class="ink" x="840" y="130" text-anchor="middle">Postgres 2</text>
    <rect class="role role-pub" x="760" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="798" y="163" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="848" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="886" y="163" text-anchor="middle">slot</text>

    <rect class="role role-cdc" x="760" y="240" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="840" y="264" text-anchor="middle">
      CDC consumer
    </text>

    <rect class="role role-engine" x="760" y="310" width="160" height="60"
          rx="6" ry="6"/>
    <text class="ink" x="840" y="338" text-anchor="middle">engine</text>
    <text class="ink-small" x="840" y="356" text-anchor="middle">
      predicate match
    </text>

    <line class="arrow evt" x1="840" y1="200" x2="840" y2="238"
          marker-end="url(#head-evt)"/>
    <line class="arrow evt" x1="840" y1="280" x2="840" y2="308"
          marker-end="url(#head-evt)"/>
    <line class="arrow evt" x1="840" y1="370" x2="840" y2="448"
          marker-end="url(#head-evt)"/>
  </g>

  <!-- Application box at the bottom -->
  <rect class="role role-app" x="100" y="450" width="840" height="90"
        rx="8" ry="8"/>
  <text class="ink" x="500" y="490" text-anchor="middle">application</text>
  <text class="ink-small" x="500" y="512" text-anchor="middle">
    receives matches from all M engines and fans them in
  </text>

  <!-- Annotation -->
  <text class="ink-label" x="500" y="412" text-anchor="middle">
    same predicate registered on each engine independently
  </text>
</svg>
