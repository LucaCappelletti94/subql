<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 700"
     width="1000" height="700"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql diagram palette and role primitives</title>
  <desc>Canonical reference for the SVG symbol library used by every
        diagram in this directory. Edit this file first and re-paste the
        defs block into each consumer diagram so the set stays in sync.</desc>

  <defs>
    <!-- ====================================================
         Shared style. Every diagram should include the same
         declarations so role colors, fonts, and stroke widths
         stay identical across the set.
         ==================================================== -->
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-writer   { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pg       { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pub      { fill: #c8e6c9; stroke: #2e7d32; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-wal      { fill: #ef6c00; stroke: #bf360c; }
      .role-poll     { fill: #fff3e0; stroke: #ef6c00; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-engine   { fill: #d1c4e9; stroke: #4527a0; stroke-width: 2; }
      .role-fanin    { fill: #b39ddb; stroke: #311b92; stroke-width: 2; }
      .role-consumer { fill: #e3f2fd; stroke: #1565c0; }
      .role-app      { fill: none; stroke: #1565c0; stroke-width: 1.5;
                       stroke-dasharray: 6 4; }

      .ink           { fill: #212121; font-size: 14px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-title     { fill: #212121; font-size: 18px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 12px; font-style: italic; }
      .ink-replica   { fill: #0277bd; font-size: 11px; font-weight: 600; }
      .ink-onfill    { fill: #ffffff; font-size: 12px; font-weight: 600; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2; }
      .poll-q        { stroke: #ef6c00; stroke-width: 1.8;
                       stroke-dasharray: 5 4; }
      .poll-r        { stroke: #ef6c00; stroke-width: 2; }
      .ctrl          { stroke: #9e9e9e; stroke-width: 1.2;
                       stroke-dasharray: 3 3; }
      .replication   { stroke: #0288d1; stroke-width: 2;
                       stroke-dasharray: 6 4; }
    ]]></style>

    <!-- ====================================================
         Arrow heads. One marker per stroke style so the
         arrowhead color matches the line color.
         ==================================================== -->
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
    <marker id="head-poll" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/>
    </marker>
    <marker id="head-ctrl" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
    <marker id="head-replication" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0288d1"/>
    </marker>

    <!-- ====================================================
         Compound symbols. Use these via <use href="#name"
         x=".." y=".." /> when the same icon appears many
         times in one diagram (typical for mesh M=3 sweeps).
         ==================================================== -->

    <!-- A PG container with publication and slot chips inside.
         Default size 220x140. -->
    <symbol id="pg-with-slot" viewBox="0 0 220 140">
      <rect class="role role-pg" x="2" y="2" width="216" height="136"
            rx="8" ry="8"/>
      <text class="ink" x="14" y="22">Postgres</text>
      <rect class="role role-pub" x="14" y="48" width="80" height="24"
            rx="4" ry="4"/>
      <text class="ink-small" x="54" y="64" text-anchor="middle">
        publication
      </text>
      <rect class="role role-slot" x="118" y="48" width="86" height="28"
            rx="4" ry="4"/>
      <path class="role role-slot" d="M118 62 L110 62 L110 70 L118 70 z"/>
      <text class="ink-small" x="161" y="66" text-anchor="middle">slot</text>
      <!-- Generic writer indicator inside the PG, optional -->
      <rect class="role role-writer" x="14" y="92" width="80" height="32"
            rx="4" ry="4"/>
      <text class="ink-small" x="54" y="112" text-anchor="middle">writer</text>
    </symbol>

    <!-- A long-lived wal-sender lane. Drawn as a tall slim block. -->
    <symbol id="wal-sender" viewBox="0 0 36 100">
      <rect class="role role-wal" x="2" y="2" width="32" height="96"
            rx="4" ry="4"/>
      <text class="ink-onfill" x="18" y="54" text-anchor="middle"
            transform="rotate(-90 18 54)">wal sender</text>
    </symbol>

    <!-- A CDC consumer chip. -->
    <symbol id="cdc-consumer" viewBox="0 0 140 50">
      <rect class="role role-cdc" x="2" y="2" width="136" height="46"
            rx="6" ry="6"/>
      <text class="ink" x="70" y="30" text-anchor="middle">
        CDC consumer
      </text>
    </symbol>

    <!-- The subql engine block. -->
    <symbol id="engine" viewBox="0 0 160 90">
      <rect class="role role-engine" x="2" y="2" width="156" height="86"
            rx="8" ry="8"/>
      <text class="ink-onfill" x="80" y="40" text-anchor="middle"
            style="fill:#212121">engine</text>
      <text class="ink-small" x="80" y="60" text-anchor="middle"
            style="fill:#424242">predicate match</text>
    </symbol>

    <!-- Multi-source fan-in adapter (trapezoidal). -->
    <symbol id="fanin" viewBox="0 0 160 110">
      <path class="role role-fanin"
            d="M2 6 L158 36 L158 74 L2 104 z" />
      <text class="ink-onfill" x="80" y="60" text-anchor="middle">
        fan in
      </text>
    </symbol>

    <!-- An application consumer endpoint. -->
    <symbol id="consumer" viewBox="0 0 120 44">
      <rect class="role role-consumer" x="2" y="2" width="116" height="40"
            rx="6" ry="6"/>
      <text class="ink" x="60" y="27" text-anchor="middle">consumer</text>
    </symbol>

    <!-- A polling client (circle with a clock hand). -->
    <symbol id="polling-client" viewBox="0 0 90 90">
      <circle class="role role-poll" cx="45" cy="45" r="40"/>
      <line stroke="#bf360c" stroke-width="2.5" stroke-linecap="round"
            x1="45" y1="45" x2="45" y2="18"/>
      <line stroke="#bf360c" stroke-width="2.5" stroke-linecap="round"
            x1="45" y1="45" x2="64" y2="55"/>
      <circle fill="#bf360c" cx="45" cy="45" r="3"/>
      <text class="ink-small" x="45" y="85" text-anchor="middle">
        polling
      </text>
    </symbol>
  </defs>

  <!-- ====================================================
       Palette showcase. The actual diagrams do not display
       this; it lives in _symbols.svg as a visual reference.
       ==================================================== -->
  <text class="ink-title" x="40" y="40">subql diagram palette</text>
  <text class="ink-caption" x="40" y="62">
    Edit `_symbols.svg` first; copy the &lt;defs&gt; block into each
    diagram so the set stays in sync.
  </text>

  <!-- Row 1: containers and chips -->
  <use href="#pg-with-slot" x="40" y="100" width="220" height="140"/>
  <use href="#wal-sender"   x="290" y="100" width="36" height="100"/>
  <use href="#cdc-consumer" x="360" y="120" width="140" height="50"/>
  <use href="#polling-client" x="530" y="100" width="90" height="90"/>
  <use href="#engine"       x="650" y="100" width="160" height="90"/>

  <!-- Row 2: fan-in and consumers -->
  <use href="#fanin"        x="40" y="280" width="160" height="110"/>
  <use href="#consumer"     x="230" y="305" width="120" height="44"/>
  <rect class="role role-app" x="380" y="280" width="160" height="110"
        rx="6" ry="6"/>
  <text class="ink" x="460" y="340" text-anchor="middle">application</text>

  <!-- Row 3: arrow legend -->
  <text class="ink" x="40" y="450">arrow types</text>
  <line class="arrow evt" x1="40" y1="478" x2="180" y2="478"
        marker-end="url(#head-evt)"/>
  <text class="ink-small" x="190" y="482">event flow (push, polling response)</text>

  <line class="arrow poll-q" x1="40" y1="508" x2="180" y2="508"
        marker-end="url(#head-poll)"/>
  <text class="ink-small" x="190" y="512">polling query</text>

  <line class="arrow poll-r" x1="40" y1="538" x2="180" y2="538"
        marker-end="url(#head-poll)"/>
  <text class="ink-small" x="190" y="542">polling response</text>

  <line class="arrow ctrl" x1="40" y1="568" x2="180" y2="568"
        marker-end="url(#head-ctrl)"/>
  <text class="ink-small" x="190" y="572">control (acks, status updates)</text>

  <line class="arrow replication" x1="40" y1="598" x2="180" y2="598"
        marker-end="url(#head-replication)"/>
  <text class="ink-small" x="190" y="602">PG-native logical replication</text>
</svg>
