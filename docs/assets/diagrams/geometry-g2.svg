<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 600"
     width="1000" height="600"
     font-family="Inter, Helvetica, Arial, sans-serif">
  <title>subql subscription geometry G2: many PGs per subscription</title>
  <desc>Multiple CDC consumers feed a single fan-in adapter that
        tags each event with its source PG. Downstream of the
        fan-in there is exactly one engine and one consumer.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .role          { stroke-width: 1.5; }
      .role-pg       { fill: #e8f5e9; stroke: #2e7d32; }
      .role-pub      { fill: #c8e6c9; stroke: #2e7d32; }
      .role-slot     { fill: #fff3e0; stroke: #ef6c00; }
      .role-cdc      { fill: #ede7f6; stroke: #5e35b1; }
      .role-fanin    { fill: #b39ddb; stroke: #311b92; stroke-width: 2; }
      .role-engine   { fill: #d1c4e9; stroke: #4527a0; stroke-width: 2; }
      .role-consumer { fill: #e3f2fd; stroke: #1565c0; }
      .role-app      { fill: none; stroke: #1565c0; stroke-width: 1.5;
                       stroke-dasharray: 6 4; }

      .ink           { fill: #212121; font-size: 14px; }
      .ink-small     { fill: #212121; font-size: 11px; }
      .ink-title     { fill: #212121; font-size: 20px; font-weight: 600; }
      .ink-caption   { fill: #424242; font-size: 12px; font-style: italic; }
      .ink-label     { fill: #424242; font-size: 11px; font-weight: 500; }
      .ink-onfill    { fill: #ffffff; font-size: 13px; font-weight: 600; }

      .arrow         { fill: none; stroke-linecap: round; }
      .evt           { stroke: #424242; stroke-width: 2; }
    ]]></style>
    <marker id="head-evt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ink-title" x="500" y="40" text-anchor="middle">
    geometry G2: many Postgres per subscription
  </text>
  <text class="ink-caption" x="500" y="62" text-anchor="middle">
    one engine ingests M sources via a fan-in adapter
  </text>

  <!-- Three Postgres columns (top), each with a small CDC consumer -->
  <g>
    <rect class="role role-pg" x="100" y="100" width="200" height="100"
          rx="8" ry="8"/>
    <text class="ink" x="200" y="130" text-anchor="middle">Postgres 0</text>
    <rect class="role role-pub" x="120" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="158" y="163" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="208" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="246" y="163" text-anchor="middle">slot</text>

    <rect class="role role-cdc" x="120" y="230" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="200" y="254" text-anchor="middle">
      CDC consumer
    </text>
    <line class="arrow evt" x1="200" y1="200" x2="200" y2="228"
          marker-end="url(#head-evt)"/>
  </g>

  <g>
    <rect class="role role-pg" x="420" y="100" width="200" height="100"
          rx="8" ry="8"/>
    <text class="ink" x="520" y="130" text-anchor="middle">Postgres 1</text>
    <rect class="role role-pub" x="440" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="478" y="163" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="528" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="566" y="163" text-anchor="middle">slot</text>

    <rect class="role role-cdc" x="440" y="230" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="520" y="254" text-anchor="middle">
      CDC consumer
    </text>
    <line class="arrow evt" x1="520" y1="200" x2="520" y2="228"
          marker-end="url(#head-evt)"/>
  </g>

  <g>
    <rect class="role role-pg" x="740" y="100" width="200" height="100"
          rx="8" ry="8"/>
    <text class="ink" x="840" y="130" text-anchor="middle">Postgres 2</text>
    <rect class="role role-pub" x="760" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="798" y="163" text-anchor="middle">pub</text>
    <rect class="role role-slot" x="848" y="148" width="76" height="22"
          rx="4" ry="4"/>
    <text class="ink-small" x="886" y="163" text-anchor="middle">slot</text>

    <rect class="role role-cdc" x="760" y="230" width="160" height="40"
          rx="6" ry="6"/>
    <text class="ink-small" x="840" y="254" text-anchor="middle">
      CDC consumer
    </text>
    <line class="arrow evt" x1="840" y1="200" x2="840" y2="228"
          marker-end="url(#head-evt)"/>
  </g>

  <!-- Fan-in funnel: a wide top, narrow bottom trapezoid -->
  <path class="role role-fanin"
        d="M150 320 L890 320 L660 400 L380 400 z"/>
  <text class="ink-onfill" x="520" y="365" text-anchor="middle">
    fan in
  </text>
  <text class="ink-small" x="520" y="384" text-anchor="middle"
        style="fill:#ffffff">tags each event with its source</text>

  <!-- Arrows from each CDC consumer into the fan-in -->
  <line class="arrow evt" x1="200" y1="270" x2="240" y2="318"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="520" y1="270" x2="520" y2="318"
        marker-end="url(#head-evt)"/>
  <line class="arrow evt" x1="840" y1="270" x2="800" y2="318"
        marker-end="url(#head-evt)"/>

  <!-- Engine -->
  <rect class="role role-engine" x="420" y="430" width="200" height="70"
        rx="8" ry="8"/>
  <text class="ink" x="520" y="462" text-anchor="middle">engine</text>
  <text class="ink-small" x="520" y="482" text-anchor="middle">
    predicate matched once across all sources
  </text>
  <line class="arrow evt" x1="520" y1="400" x2="520" y2="428"
        marker-end="url(#head-evt)"/>

  <!-- Consumer (application) -->
  <rect class="role role-consumer" x="420" y="530" width="200" height="46"
        rx="6" ry="6"/>
  <text class="ink" x="520" y="558" text-anchor="middle">
    consumer
  </text>
  <line class="arrow evt" x1="520" y1="500" x2="520" y2="528"
        marker-end="url(#head-evt)"/>
</svg>
